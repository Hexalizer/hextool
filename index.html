{src:'m1b',q:1,
question:"On a trip to the Santa Ana Zoo, you stop to admire the real life Peter the Anteater. Based on the current evolutionary data, which of the following do you and Peter have in common?",
options:["A) You both are eukaryotes","B) You are both prokaryotes","C) You and Peter have nothing in common","D) You both lack a membrane-bound nucleus"],
answer:"A) You both are eukaryotes",
exp:"Humans and anteaters are both mammals — both eukaryotes with membrane-bound nuclei, membrane-bound organelles, and multicellularity. Prokaryotes lack all of these features. Both share a common ancestor as members of the animal kingdom.",
con:"Phylogenetics — Shared Derived Characters (Eukaryotes)"},

{src:'m1b',q:2,
question:"A researcher observed that peacocks with larger, more colorful tail feathers attract more mates. Before concluding this trait evolved through sexual selection, what must the researcher verify first?",
options:["A) That peacocks can fly despite heavy tail feathers","B) That the trait is variable and heritable in the population","C) That female peacocks also have colorful feathers","D) That tail feathers provide protection from predators"],
answer:"B) That the trait is variable and heritable in the population",
exp:"For natural (or sexual) selection to cause evolution, the trait must be: (1) VARIABLE in the population, (2) HERITABLE. Without heritability, selection can't change allele frequencies across generations. This is Darwin's most essential precondition — you must verify heritability before concluding selection caused the trait.",
con:"Darwin's Postulates — Heritability Required Before Concluding Selection"},

{src:'m1b',q:3,
question:"Researchers hypothesized that anteaters have long tongues to reach the bottom of anthills for feeding. They conducted an observation study of anteaters feeding at different sizes of the anthills. Which graph supports the hypothesis that anteater tongue length correlates with anthill depth?",
visual:"IMG:anteater",
options:["A) Bell curve peak aligned with the tongue-length dotted line","B) Increasing curve toward larger hills","C) Decreasing curve — feeds most at small hills","D) Bimodal"],
answer:"A) Bell curve peak aligned with the tongue-length dotted line",
exp:"If tongues evolved to match the depth of anthills they feed at most, anteaters should spend most time at hills matching their tongue length. Graph A shows peak feeding frequency at the hill size matching average tongue length (dotted line) = supports the hypothesis.",
con:"Scientific Method — Hypothesis-Supporting Graph Interpretation"},

{src:'m1b',q:4,
question:"In a population of cats, the frequency of alleles H and h are p (H) = 0.5 and q (h) = 0.5. If this population is in Hardy-Weinberg Equilibrium what genotype frequencies would you expect?",
options:["A) HH=0.7, Hh=0.2, hh=0.1","B) HH=0.25, Hh=0.5, hh=0.25","C) HH=0.6, Hh=0.3, hh=0.1","D) HH=0.4, Hh=0.3, hh=0.3"],
answer:"B) HH=0.25, Hh=0.5, hh=0.25",
exp:"HWE: HH=p²=0.5²=0.25; Hh=2pq=2(0.5)(0.5)=0.50; hh=q²=0.5²=0.25. Sum=1.0. When p=q=0.5, heterozygotes are exactly twice the frequency of each homozygote.",
con:"Hardy-Weinberg Equilibrium — Calculation with Equal Allele Frequencies"},

{src:'m1b',q:5,
question:"What might you conclude from the observation that the bones in your leg and foot are similar to the bones in a horse's back leg?",
options:["A) Horses didn't need all their toes, so they were lost","B) Humans gained toes during evolution","C) The bones in the horse's back leg are vestigial","D) The bones in the horse's back leg are homologous to your leg and foot bones"],
answer:"D) The bones in the horse's back leg are homologous to your leg and foot bones",
exp:"Similar bone arrangement in different species' limbs = HOMOLOGOUS structures (shared ancestry, same embryonic origin). Horse legs and human legs both derive from the ancestral tetrapod limb pattern (humerus/femur → radius-ulna/tibia-fibula → carpals → digits). Not vestigial — horse legs are fully functional.",
con:"Evidence for Evolution — Homologous Structures"},

{src:'m1b',q:6,
question:"According to Darwin, which of the following is NOT necessary for evolution to occur?",
options:["A) Sexual selection","B) Traits that are heritable","C) Survival is not random","D) The source of variation is random"],
answer:"A) Sexual selection",
exp:"Darwin's 4 postulates for evolution by natural selection: (1) Variation, (2) Heritability, (3) Non-random survival/reproduction (differential fitness), (4) Random source of variation (mutation). Sexual selection is a MECHANISM of selection, not a prerequisite. Evolution can occur via natural selection without sexual selection.",
con:"Darwin's 4 Postulates — NOT Required for Evolution"},

{src:'m1b',q:7,
question:"Most Swiss starlings produce four to five eggs in each clutch. Starlings producing fewer or more than this have reduced fitness. Which of the following terms best describes this situation?",
options:["A) Directional selection","B) Stabilizing selection","C) Balancing selection","D) Disruptive selection"],
answer:"B) Stabilizing selection",
exp:"Stabilizing selection: individuals at the EXTREMES have lower fitness; intermediate phenotypes are favored. Here: both fewer AND more eggs than 4-5 = lower fitness → selection maintains the intermediate clutch size. Classic example from Lack's studies on European starlings.",
con:"Types of Selection — Stabilizing Selection (Intermediate Phenotype Favored)"},

{src:'m1b',q:8,
question:"Researchers measured the amount of a gene that stimulates bone growth in bird skulls during development to test the hypothesis that greater expression of the gene results in larger beaks. Which graph below supports the hypothesis?",
visual:"IMG:anteater",
options:["A) Graph A (no clear pattern)","B) Graph B (negative correlation)","C) Graph C (positive correlation — as beak size increases, gene expression increases)"],
answer:"C) Graph C (positive correlation — beak size increases, gene expression increases)",
exp:"The hypothesis states: MORE gene expression → LARGER beak. To support this, the graph must show a POSITIVE correlation (as beak size increases on x-axis, gene expression increases on y-axis). Graph C shows bars increasing from left to right = positive correlation = supports hypothesis.",
con:"Scientific Method — Positive Correlation Supports Hypothesis"},

{src:'m1b',q:9,
question:"In a population of banana slugs there are two alleles for stripe width: B and b. The BB phenotype is broad strips, Bb is medium stripes and bb is no stripes. The observed allele frequencies were B=0.9 and b=0.1, and the genotype frequencies were: BB = 0.86, Bb = 0.08, bb = 0.06. Is this population in Hardy-Weinberg equilibrium?",
options:["A) Yes","B) No"],
answer:"B) No",
exp:"HWE prediction: BB=0.9²=0.81; Bb=2(0.9)(0.1)=0.18; bb=0.1²=0.01. Observed: BB=0.86 vs predicted 0.81 (diff=0.05), Bb=0.08 vs 0.18 (diff=0.10>0.05), bb=0.06 vs 0.01 (diff=0.05). Bb differs by 0.10 > 0.05 → NOT in HWE. Suggests inbreeding or non-random mating (too many homozygotes).",
con:"Hardy-Weinberg Equilibrium — Testing Banana Slug Population"},

{src:'m1b',q:10,
question:"Inbreeding is not considered an evolutionary process because it does not",
options:["A) Change allele frequencies","B) Occur often enough to be important","C) Violate Hardy-Weinberg assumptions","D) Change genotype frequencies"],
answer:"A) Change allele frequencies",
exp:"Evolution = change in ALLELE frequencies over time. Inbreeding changes GENOTYPE frequencies (increases homozygotes, decreases heterozygotes) but does NOT change allele frequencies themselves. Since evolution requires allele frequency change, inbreeding alone is not evolution (though it violates HWE and creates conditions where drift/selection can act).",
con:"Evolution vs HWE — Inbreeding Changes Genotype, Not Allele Frequencies"},

{src:'m1b',q:11,
question:"Which statement about genetic drift is correct?",
options:["A) Genetic drift becomes more important with increasing population size","B) The direction of evolutionary change due to genetic drift is random","C) Genetic drift results from migration of new individuals","D) Genetic drift increases adaptation to environment"],
answer:"B) The direction of evolutionary change due to genetic drift is random",
exp:"Genetic drift = random changes in allele frequencies due to chance sampling events. Direction is RANDOM (not adaptive). It's more important in SMALL populations (not large). Migration = gene flow (not drift). Drift does NOT increase adaptation — it's random, often maladaptive. Only natural selection is directional and adaptive.",
con:"Evolutionary Mechanisms — Genetic Drift is Random"},

{src:'m1b',q:12,
question:"You observe the following population of 10 beetles where Black=BB, Spotted=Bb and White=bb. What is the predicted frequency of white beetles under Hardy-Weinberg Equilibrium, and is this population in equilibrium?",
visual:"IMG:beetlehwe",
options:["A) bb=0.36; No","B) bb=0.16; Yes","C) bb=0.16; No","D) bb=0.48; Yes"],
answer:"C) bb=0.16; No",
exp:"Observed: BB=0.4, Bb=0.4, bb=0.2. p(B)=0.4+(0.4÷2)=0.60, q(b)=0.40. HWE predicts: BB=0.36, Bb=2(0.6)(0.4)=0.48, bb=0.16. Key comparison: Bb observed (0.40) vs predicted (0.48) → |0.40−0.48|=0.08 > 0.05 → NOT in HWE. Excess homozygotes (fewer heterozygotes than expected) suggests inbreeding or non-random mating.",
con:"Hardy-Weinberg Equilibrium — Beetle Calculation"},

{src:'m1b',q:13,
question:"Two species of frogs live near the same pond. The red-legged frogs lay eggs at the edges of the pond, while the yellow-legged frog lays under water in the middle of the pond. Both species are capable of producing viable offspring in laboratory conditions. What type of reproductive isolation is preventing these species from interbreeding in nature?",
options:["A) Habitat isolation","B) Temporal (time) isolation","C) Mechanical isolation","D) Gametic isolation"],
answer:"A) Habitat isolation",
exp:"Both species occupy different MICROHABITATS within the same pond (edges vs middle). They could hybridize in lab (gametes compatible, so no gametic or mechanical isolation). They're not separated by time. The barrier is spatial/habitat — they don't encounter each other. = HABITAT ISOLATION (prezygotic).",
con:"Reproductive Isolation — Habitat Isolation (Prezygotic)"},

{src:'m1b',q:14,
question:"European whitefish (Coregonus lavaretus) show heritable variation in gill raker length related to differences in their diets. Longer gill rakers appear to function better for capturing open-water (pelagic) prey, while shorter gill rakers function better for capturing shallow-water (benthic) prey. Which of the following types of selection is most likely to be found in a large lake (open water in the middle and shallow water around the sides) with a high density of these fish?",
options:["A) Directional selection","B) Stabilizing selection","C) Disruptive selection","D) Sexual selection"],
answer:"C) Disruptive selection",
exp:"Disruptive selection = extremes favored, intermediates have lower fitness. Both long AND short gill rakers are adaptive (in different microhabitats) → both extremes have high fitness → intermediate length is LEAST adaptive (poor at both environments) → disruptive selection leads to two distinct morphs.",
con:"Types of Selection — Disruptive Selection"},

{src:'m1b',q:15,
question:"Modern humans (Homo sapiens) and archaic humans called Neanderthals (H. neanderthalensis) shared a common ancestor in Africa but diverged in different geographic areas. When modern humans migrated out of Africa and dispersed around the world starting about 100,000 years ago, they overlapped with Neanderthals in Europe. This scenario is best described as",
options:["A) Species living in sympatry following sympatric speciation","B) Species living in allopatry following sympatric speciation","C) Species living in allopatry following allopatric speciation","D) Species living in sympatry following allopatric speciation"],
answer:"D) Species living in sympatry following allopatric speciation",
exp:"Speciation mechanism: they diverged in DIFFERENT geographic areas (Africa vs elsewhere) = ALLOPATRIC speciation. When they met again in Europe, they were living in the SAME area = SYMPATRY. So: speciation was allopatric, but when they overlapped they were in sympatry.",
con:"Speciation — Allopatric Speciation → Secondary Sympatry"},

{src:'m1b',q:16,
question:"Sometimes people discover new species by looking at specimens that have been stored in museums. Two organisms that looked very different were actually the same species but with different colors of fur or feathers. The organisms were classified as species by using the",
options:["A) Biological species concept","B) Morphospecies concept","C) Phylogenetic species concept"],
answer:"B) Morphospecies concept",
exp:"Morphospecies concept = species classified based on PHYSICAL APPEARANCE (morphology). These were misidentified as separate species because they looked different (sexual dimorphism). Museum specimens were classified before DNA/phylogeny was available → morphospecies concept was used.",
con:"Species Concepts — Morphospecies Concept"},

{src:'m1b',q:17,
question:"In a population of tigers with two alleles for fur thickness (F and f) a small number of individuals left and started a new population in a different forest. The population sizes and genotype frequencies are in the table. What is the frequency of the f allele in the original population and the new population?",
visual:"IMG:tiger",
options:["A) Original f=0.15; New f=0.5","B) Original f=0.1; New f=0.3","C) Original f=0.5; New f=0.85","D) Original f=0.85; New f=0.5"],
answer:"A) Original f=0.15; New f=0.5",
exp:"Original: FF=0.8, Ff=0.1, ff=0.1 → f(f)=0.1+(0.1÷2)=0.15. New: FF=3/10=0.3, Ff=4/10=0.4, ff=3/10=0.3 → f(f)=0.3+(0.4÷2)=0.50. This demonstrates the FOUNDER EFFECT — small founding population has very different allele frequencies due to random sampling.",
con:"Genetic Drift — Founder Effect Calculation"},

{src:'m1b',q:18,
question:"In the new population, conditions favor having a thicker coat which is the FF genotype. Unfortunately, after several generations, the f-allele is the only allele and the population doesn't survive. A possible explanation for this is",
options:["A) Directional selection","B) Disruptive selection","C) Gene flow","D) Genetic drift"],
answer:"D) Genetic drift",
exp:"Even though selection favors FF, genetic drift can overpower selection in SMALL populations. The f-allele happened to fix by chance (random sampling eliminated the F allele). This demonstrates that in small populations, genetic drift can oppose and overcome natural selection, leading to fixation of maladaptive alleles.",
con:"Genetic Drift vs Natural Selection — Small Population Paradox"},

{src:'m1b',q:19,
question:"During an expedition in a cave, you and your partner find a population of fish without eyes. Your partner says the fish evolved to not have eyes because they didn't use them. Do you agree or disagree with this statement and why?",
options:["A) Agree — evolution occurs based on use or disuse","B) Disagree — evolution results in a perfect organism","C) Agree — evolution happens progressively","D) Disagree — evolution does not occur based on use or disuse"],
answer:"D) Disagree — evolution does not occur based on use or disuse of a trait",
exp:"Use and disuse = Lamarck's discredited theory. Darwin's actual mechanism: random mutations reduced eye development; in dark caves, eyes provide no fitness benefit (no selection to maintain them) and may even be costly → mutations losing eyes spread by selection and drift. Not because individuals 'chose not to use' them.",
con:"Evolution Misconceptions — Use and Disuse (Lamarck) is WRONG"},

{src:'m1b',q:20,
question:"A researcher studying two species of wild rabbits hypothesized that they were unable to hybridize because of post-zygotic isolation. Which result below supports their hypothesis?",
options:["A) One species lives in a field, other in forest","B) They can mate but offspring are infertile","C) One mates in April, other in June","D) Two species have different mating behaviors"],
answer:"B) They can mate, but the offspring are infertile",
exp:"Post-zygotic isolation = occurs AFTER fertilization (after a zygote forms). Infertile offspring = hybrid sterility = post-zygotic. A = habitat isolation (prezygotic). C = temporal isolation (prezygotic). D = behavioral isolation (prezygotic). Only B involves a failed post-fertilization outcome.",
con:"Reproductive Isolation — Post-Zygotic: Hybrid Sterility"},

{src:'m1b',q:21,
question:"Male frogs give calls that attract female frogs to approach and mate. Researchers examined mating calls of closely related tree frogs in South America. If reinforcement is occurring, what would you expect if you compare the calls of the two species in zones of sympatry versus zones of allopatry?",
options:["A) More similar in sympatry","B) Equally similar in both areas","C) More different in sympatry"],
answer:"C) Calls would be more different in areas of sympatry",
exp:"Reinforcement = natural selection strengthens reproductive isolation in areas where species co-occur (sympatry) to prevent costly hybrid matings. Mating calls would diverge MORE in sympatry (character displacement) compared to allopatric zones where there's no selection pressure to differ.",
con:"Speciation — Reinforcement: More Different in Sympatry"},

{src:'m1b',q:22,
question:"There is an island in the middle of a large river that houses a large population of ants. Damming of the river causes the island to flood and only the highest points of the island are now above water. The ants cannot swim, so are now in multiple isolated populations. Which of the following best describes this event?",
options:["A) Isolation by vicariance","B) Isolation by dispersal","C) A form of sympatric speciation","D) Only polyploidy could lead to speciation here"],
answer:"A) This situation represents isolation by vicariance",
exp:"Vicariance = a pre-existing population is SPLIT by a geographic barrier that arises. Here: the flooding created water barriers separating previously connected populations = vicariance (landscape change splitting populations). Dispersal = a group migrates TO a new isolated area. Sympatric speciation = speciation without geographic isolation.",
con:"Speciation — Allopatric Speciation: Vicariance vs Dispersal"},

{src:'m1b',q:23,
question:"Each species of manakin bird in Central and South America uses a different pattern of snapping sounds to attract mates. If reinforcement is occurring, what would you expect if you compare the snapping patterns of the two species in zones of sympatry versus zones of allopatry?",
options:["A) More similar in areas of sympatry","B) Equally similar in both areas","C) More different in areas of sympatry"],
answer:"C) Snapping patterns would be more different in areas of sympatry",
exp:"Reinforcement: where two species co-occur (sympatry), mating mistakes are costly (hybrid offspring = lower fitness). Selection favors individuals whose signals are MOST DISTINCT from the other species → snapping patterns diverge in sympatry more than in allopatry. = Character displacement in reproductive signals.",
con:"Speciation — Reinforcement & Character Displacement"},

{src:'m1b',q:24,
question:"A plant species undergoes an error during meiosis where homologous chromosomes fail to separate during meiosis I, resulting in diploid gametes instead of haploid ones. This plant then self-fertilizes. What is the most likely outcome?",
options:["A) Normal diploid plants identical to parent","B) Tetraploid (4n) offspring — new species via autopolyploidy","C) Sterile hybrids","D) Tetraploid (4n) offspring — new species via allopolyploidy"],
answer:"B) The offspring will be tetraploid (4n) and may represent a new species through autopolyploidy",

let deck=[...cards],idx=0,known=new Set(),rev=new Set(),mode='all',flipped=false;
function setF(m){
  mode=m;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  const map={all:0,final:1,m3b:2,m2b:3,m1b:4,review:5};
  document.querySelectorAll('.fb')[map[m]]?.classList.add('active');
  build();
}
function build(){
  if(mode==='all') deck=[...cards];
  else if(mode==='review') deck=cards.filter(c=>rev.has(c.src+c.q));
  else deck=cards.filter(c=>c.src===mode);
  idx=0;flipped=false;render();
}
function shuf(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0;flipped=false;document.getElementById('card').classList.remove('flipped');render();
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped',flipped);}
function next(){if(idx<deck.length-1){idx++;flipped=false;document.getElementById('card').classList.remove('flipped');render();}}
function prev(){if(idx>0){idx--;flipped=false;document.getElementById('card').classList.remove('flipped');render();}}
function mark(t){
  const c=deck[idx],k=c.src+c.q;
  if(t==='k'){known.add(k);rev.delete(k);}else{rev.add(k);known.delete(k);}
  updateScore();next();
}
function updateScore(){
  document.getElementById('kp').textContent='✓ '+known.size;
  document.getElementById('rp').textContent='⚠ '+rev.size;
}
function bc(s){return{final:'b-fin',m3b:'b-m3b',m2b:'b-m2b',m1b:'b-m1b'}[s]||'b-fin'}
function bl(s){return{final:'Final Exam',m3b:'Midterm 3 §B',m2b:'Midterm 2 §B',m1b:'Midterm 1 §B'}[s]||s}
function visHtml(v){
  if(!v) return '';
  if(v.startsWith('IMG:')){
    const src=IMAGES[v.slice(4)]||'';
    return src?'<div class="vis"><img src="data:image/jpeg;base64,'+src+'" alt="diagram"/></div>':'';
  }
  return '<div class="vis">'+v+'</div>';
}
function render(){
  if(!deck.length){
    document.getElementById('fr').innerHTML='<div class="qtext" style="text-align:center;margin-top:60px;color:var(--mut)">No cards match this filter.</div>';
    document.getElementById('bk').innerHTML='';
    document.getElementById('ctr').innerHTML='';
    return;
  }
  const c=deck[idx],tot=deck.length,k=c.src+c.q;
  document.getElementById('pb').style.width=Math.round(((idx+1)/tot)*100)+'%';
  document.getElementById('ctr').innerHTML='<strong>'+(idx+1)+'</strong> / '+tot;
  document.getElementById('st').textContent=(idx+1)+'/'+tot+' · ✓'+known.size+' ⚠'+rev.size;
  const si=known.has(k)?'✓ ':rev.has(k)?'⚠ ':'';
  let fh='<div><span class="badge '+bc(c.src)+'">'+bl(c.src)+' — Q'+c.q+'</span></div>'
    +'<div class="hint">Tap to flip</div>'
    +'<div class="qtext">'+si+c.question+'</div>';
  fh+=visHtml(c.visual);
  if(c.options){fh+='<div class="opts">';c.options.forEach(o=>{fh+='<div class="opt">'+o+'</div>';});fh+='</div>';}
  document.getElementById('fr').innerHTML=fh;
  let bh='<div><span class="badge '+bc(c.src)+'">'+bl(c.src)+' — Q'+c.q+'</span></div>'
    +'<div class="qtext">'+c.question+'</div>'
    +visHtml(c.visual)
    +'<div class="albl">✓ Correct Answer</div>'
    +'<div class="atxt">'+c.answer+'</div>'
    +'<div class="exp">'+c.exp+'</div>';
  if(c.con) bh+='<div class="con"><strong>📌 Concept</strong>'+c.con+'</div>';
  document.getElementById('bk').innerHTML=bh;
  document.getElementById('pb2').disabled=idx===0;
  document.getElementById('nb').disabled=idx===deck.length-1;
}
let sx=0,sy=0,lastTouch=0;
document.getElementById('scene').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.getElementById('scene').addEventListener('touchend',e=>{
  lastTouch=Date.now();
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){dx>0?prev():next();return;}
  if(Math.abs(dy)<20&&Math.abs(dx)<20) flip();
},{passive:true});
document.getElementById('scene').addEventListener('click',()=>{if(Date.now()-lastTouch<500)return;flip();});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') next();
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') prev();
  else if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='g') mark('k');
  else if(e.key==='r') mark('r');
});
render();updateScore();

</script>
