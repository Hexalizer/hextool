<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bio 94 – New Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0f1117;--surf:#1a1d27;--bord:#2e3347;
  --acc:#7c9ef5;--ora:#f5a05a;--grn:#6fd4a8;--pur:#b67cf5;
  --txt:#e8eaf2;--mut:#7b82a0;--cfr:#1e2235;--cbk:#1a2e28;
  --fin:#e8734a;--m3b:#6fc4d4;--m2b:#a8d46f;--m1b:#d4a06f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
header{background:var(--surf);border-bottom:1px solid var(--bord);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--acc);white-space:nowrap}
.logo span{color:var(--txt)}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.fb{padding:5px 11px;border-radius:20px;border:1px solid var(--bord);background:transparent;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:.74rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.fb.fin.active{border-color:var(--fin);color:var(--fin);background:rgba(232,115,74,.12)}
.fb.m3b.active{border-color:var(--m3b);color:var(--m3b);background:rgba(111,196,212,.12)}
.fb.m2b.active{border-color:var(--m2b);color:var(--m2b);background:rgba(168,212,111,.12)}
.fb.m1b.active{border-color:var(--m1b);color:var(--m1b);background:rgba(212,160,111,.12)}
.fb.rev.active{border-color:var(--ora);color:var(--ora);background:rgba(245,160,90,.12)}
.stats{font-size:.72rem;color:var(--mut);white-space:nowrap}
.prog-wrap{height:3px;background:var(--bord)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--grn));transition:width .4s}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 12px;gap:14px}
.counter{font-size:.8rem;color:var(--mut)}
.counter strong{color:var(--txt)}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.b-fin{background:rgba(232,115,74,.15);color:var(--fin)}
.b-m3b{background:rgba(111,196,212,.15);color:var(--m3b)}
.b-m2b{background:rgba(168,212,111,.15);color:var(--m2b)}
.b-m1b{background:rgba(212,160,111,.15);color:var(--m1b)}
.scene{width:100%;max-width:680px;perspective:1200px;cursor:pointer;touch-action:manipulation}
.card{width:100%;min-height:320px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;width:100%;min-height:320px;backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column}
.front{background:var(--cfr);border:1px solid var(--bord)}
.back{background:var(--cbk);border:1px solid rgba(111,212,168,.25);transform:rotateY(180deg)}
.hint{font-size:.68rem;color:var(--mut);text-align:center;margin-bottom:8px}
.qtext{font-family:'Playfair Display',serif;font-size:.95rem;line-height:1.65;margin-bottom:10px}
.vis{margin:6px 0 10px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.96);padding:4px;text-align:center}
.vis img{max-width:100%;height:auto;display:block;margin:0 auto;border-radius:5px}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.opt{padding:8px 11px;border-radius:7px;border:1px solid var(--bord);font-size:.82rem;color:var(--mut);line-height:1.4}
.albl{font-size:.7rem;color:var(--grn);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;font-weight:500}
.atxt{font-family:'Playfair Display',serif;font-size:1rem;color:var(--grn);margin-bottom:10px;line-height:1.5}
.exp{font-size:.82rem;color:var(--mut);line-height:1.65;background:rgba(0,0,0,.2);padding:11px;border-radius:7px;border-left:3px solid var(--grn)}
.con{font-size:.74rem;color:var(--acc);margin-top:10px;padding:7px 10px;background:rgba(124,158,245,.08);border-radius:5px;border:1px solid rgba(124,158,245,.2)}
.con strong{display:block;margin-bottom:2px}
.back .qtext{font-size:.82rem;color:var(--mut);margin-bottom:9px}
.nav{display:flex;gap:10px;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.nbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--bord);background:var(--surf);color:var(--txt);font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.nbtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
.shuf{padding:8px 16px;border-radius:22px;border:1px solid var(--bord);background:var(--surf);color:var(--mut);font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all .2s}
.shuf:hover{border-color:var(--ora);color:var(--ora)}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.spill{padding:5px 12px;border-radius:16px;font-size:.78rem;font-weight:500}
.spill.k{background:rgba(111,212,168,.15);color:var(--grn);border:1px solid rgba(111,212,168,.3)}
.spill.r{background:rgba(245,160,90,.12);color:var(--ora);border:1px solid rgba(245,160,90,.3)}
.mbtn{padding:7px 16px;border-radius:16px;border:none;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s}
.mk{background:rgba(111,212,168,.2);color:var(--grn)}
.mk:hover{background:rgba(111,212,168,.35)}
.mr{background:rgba(245,160,90,.15);color:var(--ora)}
.mr:hover{background:rgba(245,160,90,.3)}
@media(max-width:480px){
  header{padding:10px 12px;gap:8px}
  .filters{gap:4px}
  .fb{padding:4px 9px;font-size:.7rem}
  .face{padding:14px}
  .qtext{font-size:.88rem}
  main{padding:10px 8px;gap:10px}
}</style>
</head>
<body>
<header>
  <div class="logo">Bio<span>94</span> New</div>
  <div class="filters">
    <button class="fb fin active" onclick="setF('all')">All (100)</button>
    <button class="fb fin" onclick="setF('final')">Final</button>
    <button class="fb m3b" onclick="setF('m3b')">M3 §B</button>
    <button class="fb m2b" onclick="setF('m2b')">M2 §B</button>
    <button class="fb m1b" onclick="setF('m1b')">M1 §B</button>
    <button class="fb rev" onclick="setF('review')">⚠ Review</button>
  </div>
  <div class="stats" id="st"></div>
</header>
<div class="prog-wrap"><div class="prog-fill" id="pb" style="width:0%"></div></div>
<main>
  <div class="counter" id="ctr"></div>
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front" id="fr"></div>
      <div class="face back" id="bk"></div>
    </div>
  </div>
  <div class="nav">
    <button class="nbtn" id="pb2" onclick="prev()">←</button>
    <button class="shuf" onclick="shuf()">⇌ Shuffle</button>
    <button class="nbtn" id="nb" onclick="next()">→</button>
  </div>
  <div class="srow">
    <span class="spill k" id="kp">✓ 0</span>
    <button class="mbtn mk" onclick="mark('k')">✓ Got it</button>
    <button class="mbtn mr" onclick="mark('r')">⚠ Review</button>
    <span class="spill r" id="rp">⚠ 0</span>
  </div>
</main>

{src:'final',q:1,
question:"A researcher was interested in studying the impact of wolves as they expanded their range into the southern Sierras. They decided to put a fence around one area to exclude the wolves, and then traced the species richness in the area without wolves and an area with wolves. Their results are on the right. Based on their data you can conclude that",
visual:"IMG:wolf",
options:["A) The habitat with wolves was more stable","B) Adding wolves reduced species richness","C) The new species (wolves) may be a keystone species","D) Removing wolves increased species richness"],
answer:"C) The new species may be a keystone species",
exp:"The graph shows species richness rose in the wolf area but stayed flat without wolves. A keystone species has a disproportionately large effect on its ecosystem — consistent with wolves increasing biodiversity through trophic cascades.",
con:"Ecology — Keystone Species & Trophic Cascades"},

{src:'final',q:2,
question:"An increase in ocean temperatures from 1900 to the present is an example of _____, while the unusual amount of rain California received during a few days in February is an example of _____.",
options:["A) Seasons, climate","B) Seasons, weather","C) Climate, weather","D) Weather, climate"],
answer:"C) Climate, weather",
exp:"Climate = long-term patterns over decades/centuries (ocean temp trend from 1900). Weather = short-term atmospheric conditions (a few days of rain). Seasons relate to predictable annual cycles, not these scenarios.",
con:"Ecology — Climate vs Weather"},

{src:'final',q:3,
question:"Two different species of butterfly were forced into the same habitat due to urban development. The adults were equally effective at feeding on nectar from several kinds of flowers. However, both species of caterpillar larva ate the same type of milkweed, and one species ate faster than the others. One of the adult species is likely to become extinct because",
options:["A) The larvae have similar fundamental niches","B) The adults are unable to establish realized niches","C) The larvae exhibit symmetric competition","D) Niche differentiation prevents larvae from evolving"],
answer:"A) The larvae have similar fundamental niches",
exp:"Competitive exclusion: if two species occupy the same fundamental niche and one is more efficient, the inferior competitor is excluded. The larvae occupy the SAME resource (milkweed) and compete asymmetrically — the faster eater wins.",
con:"Community Ecology — Competitive Exclusion & Fundamental Niche"},

{src:'final',q:4,
question:"According to most conservation biologists, the single greatest threat to marine biodiversity is ________",
options:["A) Alteration or destruction of the physical habitat","B) Chemical pollution of water and air","C) Stratospheric ozone depletion","D) Overexploitation of certain species"],
answer:"D) Overexploitation of certain species",
exp:"For marine biodiversity specifically, overexploitation (overfishing, bycatch) is the primary threat. Habitat destruction is the top threat for terrestrial biodiversity, but in the ocean, overexploitation of fish and other species is the main driver of decline.",
con:"Conservation Biology — Threats to Marine Biodiversity"},

{src:'final',q:5,
question:"Astronomers found a planet that might be capable of supporting life, but they weren't sure if the planet had seasons. What aspect of the planet would create a world with minimal seasonal variation?",
options:["A) Lack of oceans around the equator (minimize Hadley cells)","B) Axis tilt of 30°","C) Axis tilt close to 0°","D) Perfect circular orbit (constant distance from sun)"],
answer:"C) The tilt of the planet's axis is close to 0°",
exp:"Seasons are caused by axial tilt, not orbital distance. A 0° tilt = no part of the planet leans toward/away from the sun at any point in orbit = no seasonal variation. Earth's 23.5° tilt causes our seasons. A circular orbit doesn't eliminate seasons.",
con:"Ecology — Climate: Axial Tilt and Seasons"},

{src:'final',q:6,
question:"During La Niña events, changes in wind patterns increase upwelling. What will happen as a consequence?",
options:["A) High nutrients will increase primary productivity","B) Low temperatures will favor invasive species","C) Cold water will kill off plankton","D) Low nutrients will cause an algal bloom"],
answer:"A) High nutrients will increase primary productivity",
exp:"Upwelling brings cold, nutrient-rich deep water to the surface. High nutrients → phytoplankton blooms → increased primary productivity → supports entire food web. This is why upwelling zones (e.g., California coast) are highly productive fishing areas.",
con:"Ecology — Upwelling, La Niña, and Ocean Productivity"},

{src:'final',q:7,
question:"Due to changes in phenology, rabbits started hibernating for a month longer than usual. Which species will be directly affected by the absence of rabbits?",
visual:"IMG:foodweb",
options:["A) Grains","B) Mice","C) Grasses","D) Birds"],
answer:"C) Grasses",
exp:"Rabbits eat Grasses (and Carrots) — these are their direct prey (producers eaten by rabbits). Without rabbits consuming them, grasses would increase. Foxes and birds are indirectly affected. Mice eat grasses too but mice are not directly affected by rabbit absence.",
con:"Food Webs — Direct vs Indirect Effects"},

{src:'final',q:8,
question:"In some neighborhoods, people use poisoned bait to kill mice. Unfortunately, owls are dying because they are eating the poisoned mice. Without owls, which species will decrease in abundance?",
visual:"IMG:foodweb",
options:["A) Mice","B) Grains","C) Birds","D) Carrots"],
answer:"B) Grains",
exp:"Without owls: mice are no longer controlled → mice population INCREASES. More mice eat more grains → GRAINS DECREASE. This is a trophic cascade: removing owls → mice boom → grains decline. Counterintuitively, the prey of the prey decreases.",
con:"Food Webs — Trophic Cascades"},

{src:'final',q:9,
question:"In many areas, herbicides are sprayed on the grains to kill weeds. This could also be fatal to owls because of",
visual:"IMG:foodweb",
options:["A) Niche differentiation","B) Eutrophication","C) Competitive exclusion","D) Biomagnification"],
answer:"D) Biomagnification",
exp:"Biomagnification = toxins increase in concentration at each trophic level. Herbicide on grains → grasshoppers accumulate herbicide → mice accumulate more → owls accumulate the highest concentration (top predator). Top predators suffer most from biomagnification (like DDT and eagles).",
con:"Ecology — Biomagnification in Food Webs"},

{src:'final',q:10,
question:"The cells in tissues normally limit their growth in a density-dependent manner. In contrast, cancer cells often exhibit density-independent growth. During chemotherapy, the cancer cell rate of growth will begin to slow. Before chemotherapy, cancer cells exhibit a ____________ curve, but during treatment cancer cells will exhibit a ____________ curve.",
options:["A) Exponential growth, logistic growth","B) Logistic growth, exponential growth","C) Density-independent growth, exponential growth","D) Density-dependent, logistic growth"],
answer:"A) Exponential growth, logistic growth",
exp:"Before chemo: density-independent (no resource limits) = EXPONENTIAL growth (J-curve). During chemo: the drug acts as a limiting factor, slowing growth as cell density increases = LOGISTIC growth (S-curve, approaching a new lower 'carrying capacity'). Density-independent = exponential; slowing due to limiting factors = logistic.",
con:"Population Ecology — Exponential vs Logistic Growth"},

{src:'final',q:11,
question:"Why do moderate levels of disturbance result in an increase in community diversity?",
options:["A) Habitats are opened up for less competitive species","B) The environmental conditions become optimal","C) The resulting uniform habitat supports stability and diversity","D) Less-competitive species evolve strategies to compete"],
answer:"A) Habitats are opened up for less competitive species",
exp:"Intermediate Disturbance Hypothesis: too little disturbance → dominant competitors exclude others (low diversity). Too much → only disturbance-tolerant species survive (low diversity). Moderate = patches of open habitat created → colonized by less competitive species → maximum diversity.",
con:"Community Ecology — Intermediate Disturbance Hypothesis"},

{src:'final',q:12,
question:"The next two questions are about the figure below which shows egg production in a new species of iguana under different experimental conditions. (Note: castrated males cannot reproduce)  Which of the following conclusions is most logical based on the data?",
visual:"IMG:iguana_eggs",
options:["A) Lone females produce enough eggs for population growth","B) Females produce eggs faster with many males than with a single male","C) After 4 weeks, castrated males = non-castrated males","D) A female produces eggs fastest when paired with a single male"],
answer:"D) A female produces eggs fastest when paired with a single male",
exp:"The graph shows 'Female with male' (single) reaches 100% fastest — steeper rise than the group-of-males condition. Lone females barely produce eggs. Castrated males still stimulate some production but less than intact males.",
con:"Animal Behavior — Reproductive Cues & Mate Effects"},

{src:'final',q:13,
question:"Penguins have the ability to eat large fish, but prefer to eat small squid. The large fish could provide more calories than squid, but the penguins can catch squid significantly faster than they can catch fish. This is an example of",
options:["A) Density independent feeding","B) Deposit feeding","C) Fixed behavior","D) Optimal foraging"],
answer:"D) Optimal foraging",
exp:"Optimal foraging theory: animals maximize energy gain per unit time (not just calories per item). Penguins choose squid because the higher catch rate means more total energy acquired per unit time, even though fish have more calories per individual item.",
con:"Animal Behavior — Optimal Foraging Theory"},

{src:'final',q:14,
question:"During the experiment, researchers also observed males doing push-ups and raising the spikes on their backs, so they measured how frequently male iguanas did those behaviors when they were alone, when they were with females and when they were with other males. Here are the data for male behavior during different experimental conditions. Based on the data, what did they conclude?",
visual:"IMG:iguana_beh",
options:["A) Push-ups = intersexual selection; spike raises = intrasexual selection","B) Spike raises = intersexual; push-ups = intrasexual","C) Neither plays a role in sexual selection","D) Both are related to intersexual selection"],
answer:"A) Push-ups play a role in intersexual selection; spike raises are for intrasexual selection",
exp:"Push-ups are most frequent with females = male ATTRACTING females = intersexual selection. Spike raises highest with other males = male signaling to/competing with other males = intrasexual (male-male competition). Behavior context reveals function.",
con:"Animal Behavior — Intersexual vs Intrasexual Selection"},

{src:'final',q:15,
question:"Suppose researchers marked 100 penguins and later were able to trap a total of 50 individuals from that population, of which 10 were marked. What is the estimate for total population size? (N = Mn/m)",
options:["A) 5000","B) 500","C) 250","D) 2000"],
answer:"B) 500",
exp:"Mark-recapture formula: N = Mn/m = (100 × 50) / 10 = 5000/10 = 500. Where M=total marked (100), n=total recaptured (50), m=marked animals in recapture (10).",
con:"Population Ecology — Mark-Recapture Estimation"},

{src:'final',q:16,
question:"A species of bird is mostly brown in color, but the males have a set of red feathers that they display in the presence of females. You hypothesized that the red feathers are an important cue for female egg production. Which experiment would test your hypothesis?",
options:["A) Paint feathers brown and measure female egg production","B) Remove feathers from females and measure egg production","C) Relate number of feathers per male to number of eggs per female","D) Change daylight length and measure number of female offspring"],
answer:"A) Paint the feathers brown and measure female egg production",
exp:"To test if red feathers are the causal cue, you must REMOVE the cue (paint brown = eliminate red) and measure the outcome. Correlating feather number to egg number (C) is observational and can't establish causation. B tests female feathers (wrong variable). D tests photoperiod (wrong variable).",
con:"Scientific Method — Experimental Design to Test Causal Hypothesis"},

{src:'final',q:17,
question:"A student started maintaining populations of two species of birds in a research lab. One day, someone left all of the cages and the birds began to compete for food. Which of the following scenarios will most likely lead to competitive exclusion?",
options:["A) Two species prefer different sizes of seeds","B) Two species eat the same size seeds, but one is more efficient","C) One species has larger beaks to consume different-sized seeds","D) They exhibit symmetrical competition"],
answer:"B) The two bird species eat the same size seeds, but one is more efficient",
exp:"Competitive exclusion = one species eliminates another when they occupy the same niche. Same seed size preference = same niche = competition. One being more efficient = ASYMMETRIC competition → inferior competitor excluded. Different preferences (A, C) = niche differentiation → coexistence. Symmetric (D) = neither wins definitively.",
con:"Community Ecology — Competitive Exclusion Principle"},

{src:'final',q:18,
question:"The city council hired you to consult on whether or not building a new shopping mall would be damaging to the environment. Your response was that the area they selected should be protected because it's a biodiversity hotspot. What two pieces of data should you show them in order to support your claim?",
options:["A) High net primary productivity and high species richness","B) High species richness and high habitat heterogeneity","C) High species richness and high numbers of endemic species","D) Low disturbance and high numbers of endemic species"],
answer:"C) High species richness and high numbers of endemic species",
exp:"Biodiversity hotspots are defined by two criteria: (1) HIGH species richness/diversity AND (2) HIGH endemism (species found NOWHERE ELSE). Habitat heterogeneity and NPP are related but not the defining criteria. Hotspots are typically also under high threat.",
con:"Conservation Biology — Biodiversity Hotspot Definition"},

{src:'final',q:19,
question:"Why does altruism seem paradoxical?",
options:["A) Alleles causing altruistic behavior should be selected AGAINST because they may lower the organism's fitness","B) Organisms may behave altruistically to help close relatives but it doesn't benefit the species","C) Altruism does not actually help others","D) Sometimes altruistic behavior is actually selfish"],
answer:"A) Alleles that cause altruistic behavior should be selected against because they also might lower the organism's fitness",
exp:"Paradox: if altruism reduces the altruist's own fitness (e.g., helping others at personal cost), natural selection should eliminate those alleles. Resolved by kin selection (inclusive fitness) — helping relatives who share your alleles can increase allele frequency even at personal cost.",
con:"Animal Behavior — Altruism & Kin Selection Paradox"},

{src:'final',q:20,
question:"The figure below shows the number of species and abundance of each species in three communities. Community _____ has the highest species richness, while Community ______ has the highest species evenness.",
visual:"IMG:community",
options:["A) 3, 1","B) 2, 1","C) 1, 3","D) 1, 2"],
answer:"D) 1, 2",
exp:"Richness = number of species present. Community 1 has 4 species (A, B, C, D) = highest richness. Evenness = how equal the abundances are. Community 2 has 3 species but with similar abundances (most equal distribution) = highest evenness.",
con:"Community Ecology — Species Richness vs Species Evenness"},

{src:'final',q:21,
question:"When wild plant and animal populations are logged or hunted, the oldest or largest individuals tend to be taken. Unfortunately, many of the commercially important species are long lived and don't reproduce until they are older. Thus, many species are harvested during their peak reproductive years. Which of the results is likely if harvesting isn't regulated?",
options:["A) Population growth rate may decline because reproduction is reduced","B) More resources for younger individuals will increase growth rate","C) Conservation efforts will be required to protect younger individuals"],
answer:"A) Population growth rate may decline because reproduction is reduced in the population",
exp:"Removing reproductive adults (peak fecundity years) reduces R₀. Fewer breeding individuals → fewer offspring → population decline. Young individuals may survive but haven't reached reproductive age → immediate population growth drops even if they're healthy.",
con:"Population Ecology — Life History Tables & Fecundity"},

{src:'final',q:22,
question:"An ecologist was observing two species of mouse that lived at different elevations on a mountain. In the lab, they observed that the two species ate the same diet of different sizes of seeds. So, they hypothesized that the mice had the same fundamental niche, but that the high elevation species was occupying a realized niche and eating mostly small seeds. How could they test the hypothesis?",
options:["A) Study temperature range and humidity requirements","B) Add another competitor species to see if life history traits change","C) Remove the low-elevation species to see if high-elevation expands its range","D) Remove half of the high-elevation species to see if low-elevation switches food"],
answer:"C) Remove the low-elevation species to see if the high-elevation species expands its range",
exp:"To test that the high-elevation species is being pushed into a realized niche by competition, REMOVE the competitor (low-elevation species). If the hypothesis is correct, the high-elevation species should expand to eat all seed sizes again (realize its full fundamental niche).",
con:"Community Ecology — Fundamental vs Realized Niche Testing"},

{src:'final',q:23,
question:"The ecologist from the previous question decided to keep both species in the same lab enclosure and allow the mice to reproduce for 10 generations. After 10 generations, the high elevation species had smaller teeth that were better for eating small seeds. The change in the size of the teeth is an example of",
options:["A) Character displacement","B) Niche differentiation","C) Intraspecific competition","D) Resource exclusion"],
answer:"A) Character displacement",
exp:"Character displacement = when two species that overlap in a trait become MORE different in that trait when they live together (sympatry) due to selection against competing for the same resources. Smaller teeth evolved to specialize on small seeds = the species displaced its characters to reduce competition.",
con:"Community Ecology — Character Displacement"},

{src:'final',q:24,
question:"A non-profit organization is applying for funding to conserve a population of endangered rabbits. On the application, they have to use data to show that the rabbit population is declining and requires further protection. For several years, volunteers went out into the field to track survivorship and fecundity so that they could make a life-history table. Here are the field data (but you will need to finish the calculations). Based on the data, is this population likely to grow, shrink or remain stable?",
visual:"IMG:lifehistory",
options:["A) Grow","B) Shrink","C) Remain Stable","D) Cannot be predicted"],
answer:"B) Shrink",
exp:"R₀ (net reproductive rate) = 0.75. R₀ < 1.0 means each female replaces herself with less than 1 offspring on average → population SHRINKS over time. R₀ = 1 → stable; R₀ > 1 → growing. This population is declining and requires conservation intervention.",
con:"Population Ecology — Life Tables & R₀"},

{src:'final',q:25,
question:"The figure below is survivorship for some living organisms and the survivorship of a dinosaur (Tyrannosaurus) that was estimated from fossils. Even though dinosaurs and crocodiles are related they have very different survivorship curves. At 50% of their maximum life span, survivorship of Tyrannosaurus is ______ times greater than the survivorship of the crocodile.",
visual:"IMG:survcurve",
options:["A) 2","B) 3","C) 10","D) 100"],
answer:"C) 10",
exp:"At 50% lifespan on the log-scale graph: T-rex survivorship ≈ 100 individuals; Crocodile ≈ 10 individuals. Ratio = 100/10 = 10. T-rex had a Type I-like curve (high early survival), while crocodiles have a Type II curve (constant mortality rate).",
con:"Population Ecology — Survivorship Curves (Type I, II, III)"},

{src:'m3b',q:1,
question:"Species that lay fertilized eggs and nourish the embryo with a yolk are",
options:["A) Viviparous","B) Ovoviviparous","C) Oviparous"],
answer:"C) Oviparous",
exp:"Oviparous = lay eggs externally; embryo nourished by yolk inside egg (birds, most reptiles, most fish). Ovoviviparous = eggs retained internally + yolk-nourished + live birth. Viviparous = placenta provides nutrition internally (most mammals).",
con:"Vertebrate Reproduction — Oviparous / Viviparous / Ovoviviparous"},

{src:'m3b',q:2,
question:"When classified by the developmental criteria we studied, my dog is a",
options:["A) Diploblastic bilateral protostome","B) Triploblastic bilateral protostome","C) Diploblastic bilateral deuterostome","D) Triploblastic bilateral deuterostome"],
answer:"D) Triploblastic bilateral deuterostome",
exp:"Dogs = mammals = vertebrates = deuterostomes (blastopore → anus). All vertebrates are triploblastic (3 germ layers: ecto/meso/endoderm) and bilaterally symmetrical. Diploblastic = only cnidarians/ctenophores.",
con:"Animal Classification — Developmental Criteria"},

{src:'m3b',q:3,
question:"In planarians, a type of flatworm (platyhelminth), researchers found that blocking beta-catenin expression in a species with poor regeneration changed the outcome. When beta-catenin was blocked in the tail segments, the tail",
options:["A) Develop multiple complete bodies from one segment","B) Regenerate head-like structures","C) Die and show no regeneration","D) Grow faster without proper differentiation"],
answer:"B) Segment began to regenerate head-like structures",
exp:"Beta-catenin normally suppresses head fate and promotes tail identity. Blocking beta-catenin = tail segment loses its 'tail' identity and reverts toward head development. This reveals beta-catenin as a key regulator of anterior-posterior fate in planarian regeneration.",
con:"Animal Biology — Beta-Catenin in Planarian Regeneration"},

{src:'m3b',q:4,
question:"Sand crabs use their antennae for filter feeding while barnacles use modified legs for the same purpose. This is an example of",
options:["A) Homologous structures","B) Convergent evolution","C) Vestigial structures","D) Coevolution"],
answer:"B) Convergent evolution",
exp:"Different structures (antennae vs legs) performing the same function (filter feeding) in two species that are not closely related = convergent evolution (homoplasy). Homologous = same structure, different function. Vestigial = reduced/non-functional ancestral structure.",
con:"Phylogenetics — Convergent Evolution vs Homology"},

{src:'m3b',q:5,
question:"The next three questions are about the phylogenetic tree. Which of the following is a synapomorphy at branch #6?",
visual:"IMG:vertphylo",
options:["A) Ovoviviparous reproduction","B) Amniotic eggs","C) Four limbs","D) Hinged jaws"],
answer:"C) Four limbs",
exp:"Branch #6 = tetrapod node (leads to Amphibia + all Amniotes). FOUR LIMBS unites all tetrapods. Amniotic eggs = branch #7 (Amniota only — excludes Amphibia). Hinged jaws = more basal (gnathostomes, includes fish). Ovovivipary = not a universal tetrapod trait.",
con:"Vertebrate Phylogeny — Tetrapod Synapomorphy (Branch 6)"},

{src:'m3b',q:6,
question:"Which of the following is a synapomorphy at branch #9?",
visual:"IMG:vertphylo",
options:["A) Internal bony skeleton","B) Placenta","C) Viviparous reproduction","D) Endothermy"],
answer:"B) Placenta",
exp:"Branch #9 = Eutherians (placental mammals). The PLACENTA is the defining synapomorphy of Eutherians — all mammals in branch 9 nourish embryos via placenta. Marsupials (branch 8) have a vestigial placenta but primarily use a pouch. Endothermy evolved convergently in birds and mammals (not branch 9 alone).",
con:"Vertebrate Phylogeny — Eutherian Synapomorphy (Placenta)"},

{src:'m3b',q:7,
question:"The amniotic egg is a synapomorphy at branch number",
visual:"IMG:vertphylo",
options:["A) 7","B) 10","C) 6","D) 8"],
answer:"A) 7",
exp:"Branch #7 = AMNIOTA (all amniotes: Mammals + Reptiles + Birds). The amniotic egg (with amnion, chorion, allantois) allows fully terrestrial reproduction. Branch #6 = tetrapods (four limbs). Branch #8 = marsupials. Branch #10 = later reptile branches.",
con:"Vertebrate Phylogeny — Amniotic Egg at Branch 7"},

{src:'m3b',q:8,
question:"In a tide pool, a student encountered an organism with spiny skin and a water vascular system. They concluded that this organism was a(n)",
options:["A) Annelid worm","B) Gastropod","C) Echinoderm"],
answer:"C) Echinoderm",
exp:"Spiny skin + water vascular system (used for locomotion/feeding via tube feet) = ECHINODERMATA (sea stars, sea urchins, sea cucumbers). No other phylum has these two traits combined. Annelids = segmented worms. Gastropods = snails/slugs (molluscs).",
con:"Animal Diversity — Echinodermata Synapomorphies"},

{src:'m3b',q:9,
question:"The primary function of the amniotic membrane in vertebrate eggs is to",
options:["A) Protect embryo and maintain a fluid environment","B) Provide nutrients to the developing embryo","C) Collect metabolic waste products","D) Facilitate gas exchange between embryo and environment"],
answer:"A) Protect the embryo and maintain a fluid environment",
exp:"Amnion = fluid-filled membrane surrounding embryo = cushioning/protection + aquatic-like environment on land. Yolk sac = nutrients. Allantois = metabolic waste collection + gas exchange. Chorion = gas exchange with outer environment. Each of the 4 extraembryonic membranes has a distinct function.",
con:"Vertebrate Development — Extraembryonic Membranes"},

{src:'m3b',q:10,
question:"Sponges are most accurately described as ________.",
options:["A) Detritovores","B) Aquatic primary producers","C) Mass feeders","D) Suspension feeders"],
answer:"D) Suspension feeders",
exp:"Sponges = suspension/filter feeders. They pump large volumes of water through their pores (ostia), filtering out bacteria and particles. They are NOT photosynthetic (no primary production), not detritovores (don't consume dead matter from substrate), not mass feeders.",
con:"Animal Diversity — Porifera (Sponges) — Suspension Feeding"},

{src:'m3b',q:11,
question:"When evaluating evidence before recommending psilocybin (or other supplement) as a medical treatment, you should look for research articles. You can distinguish primary research articles from other articles because they contain",
options:["A) An extensive reference section","B) A detailed abstract","C) Materials and methods and results sections","D) A conclusion with future directions"],
answer:"C) Materials and methods and results sections",
exp:"Primary research articles report ORIGINAL research. They contain: Introduction, Materials and Methods, Results, Discussion. The M&M section is the most definitive indicator — it describes what the researchers actually DID. Reviews and meta-analyses also have references and abstracts but lack M&M describing a novel experiment.",
con:"Scientific Method — Primary Research Articles"},

{src:'m3b',q:12,
question:"Which type of symmetry is characterized by having only ONE plane that creates mirror images?",
options:["A) Asymmetry","B) Radial symmetry","C) Bilateral symmetry","D) Biradial symmetry"],
answer:"C) Bilateral symmetry",
exp:"Bilateral symmetry = ONE plane of symmetry (left-right) creates two mirror-image halves. Radial symmetry = multiple planes through central axis create mirror images (sea stars, jellyfish). Asymmetry = no plane creates mirror images (sponges). Most animals are bilaterally symmetrical.",
con:"Animal Body Plans — Types of Symmetry"},

{src:'m3b',q:13,
question:"Pavan found a new species of worm while he was hiking in a forest. He couldn't decide if it was an annelid, nematode or platyhelminth. He dissected it and found that it had segments and a coelom. He concluded that it was a(n)",
options:["A) Platyhelminth","B) Annelid","C) Nematode"],
answer:"B) Annelid",
exp:"Segments + TRUE coelom = Annelid (or Arthropod, but this is a worm). Platyhelminthes = ACOELOMATE + unsegmented. Nematodes = pseudocoelomate (false coelom) + unsegmented. Annelids (earthworms, leeches) = segmented + true coelom.",
con:"Animal Body Plans — Annelid Identification"},

{src:'m3b',q:14,
question:"To verify his conclusion, Pavan consulted his friend Bahareh who was an expert on using DNA for animal identification. She decided to look for a specific set of DNA sequences that would be associated with segments. She should look for DNA for",
options:["A) Hox genes","B) Regulating shedding","C) Protostome development","D) Creating mesoderm"],
answer:"A) Hox genes",
exp:"Hox genes control body segmentation and patterning along the anterior-posterior axis. Segmentation in annelids is controlled by Hox gene expression. Ecdysis-regulating genes = arthropods. Mesoderm = too broad (all triploblasts). Hox genes are directly associated with segment identity.",
con:"Evo-Devo — Hox Genes & Segmentation"},

{src:'m3b',q:15,
question:"What is the relationship between hyphae and mycelium in fungal structure?",
options:["A) Mycelium are threads that form hyphae structures","B) Hyphae are threads that form mycelium structures","C) They are two different names for the same component","D) Hyphae are reproductive structures; mycelium are feeding structures"],
answer:"B) Hyphae are threads that form mycelium structures",
exp:"Hyphae = individual thread-like filaments (the basic unit). Mycelium = the network/mass formed by many branching hyphae interconnected. Think: hyphae → threads; mycelium → the whole network. Both hyphae and mycelium function in nutrient absorption.",
con:"Fungi — Hyphae vs Mycelium"},

{src:'m3b',q:16,
question:"The next three questions are about the phylogenetic tree. From the phylogenetic tree above, which synapomorphy could be placed at Branch #2?",
visual:"IMG:animalphylo",
options:["A) Triploblasty","B) Coelom","C) Diploblasty","D) Multicellularity"],
answer:"D) Multicellularity",
exp:"Branch #2 unites all animals after Sponges diverge (at branch 1). All animals from branch 2 onward are multicellular with differentiated cells. Diploblasty/Triploblasty are more derived. Coelom is even more derived. Multicellularity is the basal animal synapomorphy.",
con:"Animal Phylogeny — Multicellularity at Branch 2"},

{src:'m3b',q:17,
question:"Being a triploblast is a synapomorphy at branch number",
visual:"IMG:animalphylo",
options:["A) 5","B) 4","C) 3","D) 8"],
answer:"B) 4",
exp:"Branch #4 = Bilateria (all bilaterally symmetrical animals with 3 germ layers). Cnidaria (branch 7 area) are DIPLOBLASTIC (2 germ layers). Branch #4 is where triploblasty (ectoderm + mesoderm + endoderm) originated, above Cnidaria.",
con:"Animal Phylogeny — Triploblasty at Branch 4"},

{src:'m3b',q:18,
question:"A major innovation that arose within animals was having jointed legs. This trait is a synapomorphy at branch number",
visual:"IMG:animalphylo",
options:["A) 10","B) 16","C) 13","D) 6"],
answer:"B) 16",
exp:"Branch #16 = Arthropoda. Jointed legs (arthropods) are a synapomorphy of Arthropoda alone on this tree. Branch 16 leads specifically to arthropods (insects, crabs, spiders, etc.) — the only group among these with jointed legs as a defining trait.",
con:"Animal Phylogeny — Arthropoda Synapomorphy (Branch 16)"},

{src:'m3b',q:19,
question:"Based on the experiments with plants and their fungal symbionts, if the plants were kept in the dark to prevent photosynthesis, then the carbon concentration in the fungus",
options:["A) Remain unchanged","B) Increase","C) Significantly decrease"],
answer:"C) Significantly decrease",
exp:"Mycorrhizal fungi receive carbon (sugars) from the plant via photosynthesis — the plant is the carbon source in this mutualism. Without light → no photosynthesis → no sugar production → fungi receive no carbon → carbon concentration in fungus decreases significantly.",
con:"Fungi Ecology — Mycorrhizal Mutualism: Carbon Flow"},

{src:'m3b',q:20,
question:"The cordyceps fungus drives infected ants to climb to locations with high humidity and cool temperatures because these conditions",
options:["A) Are better for rapid asexual reproduction","B) Kill the ant more quickly","C) Prevent other ants from removing the infected individual","D) Maximize fungal spore survival and dispersal"],
answer:"D) Maximize fungal spore survival and dispersal",
exp:"The fungus manipulates ant behavior to optimize conditions for its OWN reproduction and spore dispersal. High humidity + cool temperatures = optimal conditions for the fungus's fruiting body to grow and release spores that will land on other ants below.",
con:"Fungi Ecology — Zombie Fungus Behavioral Manipulation"},

{src:'m3b',q:21,
question:"What does the term 'protostome' refer to in animal development?",
options:["A) The first opening during gastrulation becomes the mouth","B) The animal has a protein-based exoskeleton","C) The organism develops radial symmetry during embryonic stages","D) The second opening during gastrulation becomes the mouth"],
answer:"A) The first opening during gastrulation becomes the mouth",
exp:"Protostome = 'first mouth' = the blastopore (first opening) becomes the MOUTH. Examples: annelids, molluscs, arthropods, nematodes. Deuterostomes = 'second mouth' = blastopore → anus; a second opening forms the mouth. Examples: echinoderms, chordates.",
con:"Animal Development — Protostome vs Deuterostome"},

{src:'m3b',q:22,
question:"What are nematocytes in cnidarians?",
options:["A) Filter-feeding structures in jellyfish tentacles","B) Photosynthetic algae living symbiotically in coral","C) Specialized stinging cells with harpoon-like structures","D) Reproductive cells released during spawning"],
answer:"C) Specialized stinging cells with harpoon-like structures",
exp:"Nematocytes (also called cnidocytes) = stinging cells unique to Cnidaria. They contain nematocysts — coiled harpoon-like structures that fire when triggered, injecting venom. Used for prey capture and defense. The symbionts in coral = zooxanthellae, not nematocytes.",
con:"Animal Diversity — Cnidaria: Nematocytes"},

{src:'m3b',q:23,
question:"Which specialized cells in the epidermis are responsible for producing melanin pigment?",
options:["A) Melanocytes","B) Keratinocytes","C) Fibroblasts","D) Epithelial cells"],
answer:"A) Melanocytes",
exp:"Melanocytes = specialized cells in the epidermis (stratum basale) that synthesize melanin. They transfer melanin granules to surrounding keratinocytes via dendrites. Keratinocytes = primary structural cells of epidermis. Fibroblasts = connective tissue cells. Melanin protects DNA from UV-B radiation.",
con:"Human Biology — Skin Cells: Melanocytes vs Keratinocytes"},

{src:'m3b',q:24,
question:"Why is melanoma (skin cancer) considered a relatively weak selective pressure in human evolution?",
options:["A) Most melanoma deaths occur after peak reproductive years","B) UV radiation does not cause mutations in DNA","C) Melanoma death rates are equal across all populations","D) Darker skin completely prevents melanoma"],
answer:"A) Most melanoma deaths occur after peak reproductive years",
exp:"Natural selection acts most strongly on traits affecting reproductive success. Since melanoma typically develops and kills AFTER people have already had children (post-reproductive), it has weak selective pressure — people pass on their alleles before the disease is lethal. Contrast with folate degradation (affects fetal development = strong selection).",
con:"Human Evolution — Selection Pressure & Reproductive Age"},

{src:'m3b',q:25,
question:"What is the notochord?",
options:["A) A series of protective bones surrounding the spinal cord","B) The muscular tail that extends beyond the anus in all chordate groups","C) A stiff rod that provides structural support","D) The hollow nerve cord that runs along the dorsal side of chordates"],
answer:"C) A stiff rod that provides structural support",
exp:"Notochord = flexible but firm rod-like structure that provides structural support in chordate embryos (and adult in some species like amphioxus). NOT the vertebral column (which replaces it in vertebrates) and NOT the nerve cord (which is hollow and dorsal — a separate chordate feature).",
con:"Chordates — The Notochord (vs Vertebral Column vs Nerve Cord)"},

{src:'m2b',q:1,
question:"What is the correct order of evolutionary events in the Pre-cambrian?",
options:["A) Photosynthesis → Eukaryotes → Multicellular animals","B) Eukaryotes → Multicellular animals → Photosynthesis","C) Eukaryotes → Photosynthesis → Multicellular animals"],
answer:"A) Photosynthesis, Eukaryotes, Multicellular animals",
exp:"Timeline: Photosynthesis (cyanobacteria, ~3.5 Bya) → Eukaryotes (~2 Bya, via endosymbiosis) → Multicellular animals (~700 Mya). Photosynthesis oxygenated the atmosphere, enabling aerobic metabolism needed for larger, complex eukaryotes and eventually animals.",
con:"Macroevolution — Pre-Cambrian Timeline"},

{src:'m2b',q:2,
question:"Following the mass extinction of the dinosaurs, many of the ecological niches (habitats) that they once occupied were taken over by new species of mammals which were rapidly diverging. Which term best describes this phenomenon?",
options:["A) Adaptive radiation","B) Convergent evolution","C) Homoplasies","D) Synapomorphies"],
answer:"A) Adaptive radiation",
exp:"Adaptive radiation = rapid diversification of one lineage into many species occupying different ecological niches. Post-dinosaur mammals rapidly diverged into herbivores, carnivores, insectivores, etc. — filling vacant niches = classic adaptive radiation.",
con:"Macroevolution — Adaptive Radiation"},

{src:'m2b',q:3,
question:"Researchers isolated a new species of microorganism that could breakdown plastic waste. After studying it, they concluded that it was a species of archaea and that it shared a common ancestor with eukaryotes because they both had",
options:["A) Organelles and a nuclear membrane","B) Similar RNA polymerase and start codon","C) Peptidoglycan and cell walls","D) Chemoorgano heterotroph metabolism"],
answer:"B) Similar RNA polymerase and start codon",
exp:"Universal molecular features shared by all life = evidence of common ancestry: same genetic code (AUG start codon), similar RNA polymerases. Archaea and eukaryotes share MANY similarities vs bacteria (RNA pol, histone-like proteins). Organelles/nuclear membrane = unique to eukaryotes. Peptidoglycan = bacteria only.",
con:"Universal Common Ancestry — Archaea-Eukaryote Molecular Evidence"},

{src:'m2b',q:4,
question:"Based on the tree to the right, approximately how many years ago did the ancestor of A diverge from B?",
visual:"IMG:phylomya",
options:["A) 0.5 million years","B) 1 million years","C) 2 million years","D) 3 million years"],
answer:"D) 3 million years",
exp:"Reading the x-axis (right=0, left=4 Mya): A's branch splits from B's lineage at the node where A diverges — at approximately x=3 on the time axis = 3 million years ago. The root of the whole tree is at ~4 Mya. A and B are sister taxa sharing a node at ~3 Mya.",
con:"Phylogenetics — Reading Phylograms with Time Axis"},

{src:'m2b',q:5,
question:"While closely observing a bacterial colony, you notice tubes forming between bacterial cells. Upon further analysis, you find that small circular pieces of DNA are being transported through that tube. You conclude that the bacteria are engaging in ______________.",
options:["A) Plasmid transfer via conjugation","B) DNA transfer by transformation","C) DNA transfer by transduction","D) Recombination via conjugation"],
answer:"A) Plasmid transfer via conjugation",
exp:"Conjugation = direct cell-to-cell DNA transfer via a pilus (tube/bridge). Small circular DNA pieces = PLASMIDS. Transformation = uptake of free DNA from environment. Transduction = phage-mediated transfer. The key here: physical tube between cells + circular DNA = plasmid transfer via conjugation.",
con:"Bacterial Gene Transfer — Conjugation (Plasmid Transfer)"},

{src:'m2b',q:6,
question:"Someone wanted to prove that the seeds from a newly discovered plant were from an angiosperm. Which of the following would best support their assertion that the plant is an angiosperm?",
options:["A) It produces gametes by mitosis rather than meiosis","B) It has a triploid endosperm","C) It retains its fertilized egg within its anther","D) It undergoes alternation of generations"],
answer:"B) It has a triploid endosperm",
exp:"Triploid endosperm = product of DOUBLE FERTILIZATION (unique to angiosperms). One sperm fertilizes egg → zygote; second sperm fertilizes polar nuclei → triploid (3n) endosperm = nutrient tissue. Gymnosperms and all other plants don't have triploid endosperm. Alternation of generations = all land plants.",
con:"Plant Reproduction — Double Fertilization & Triploid Endosperm"},

{src:'m2b',q:7,
question:"The next four questions are about the table of fish traits and the phylogeny based on those traits shown below. Which trait was not useful for building the phylogenetic tree?",
visual:"IMG:fishtable",
options:["A) Scales","B) Stripes","C) Fish color","D) Eye color","E) Length"],
answer:"D) Eye color",
exp:"All fish AND the outgroup have the SAME eye color (black) — no variation means no phylogenetic information. A trait must vary among species to be useful for building a tree. The other traits (scales, stripes, color, length) vary among species and can be used as characters.",
con:"Phylogenetics — Which Characters Are Informative"},

{src:'m2b',q:8,
question:"Based on the fish traits, which position on the phylogenetic tree is the accurate placement for the synapomorphy of a blue and yellow stripes?",
visual:"IMG:fishtable",
options:["A) A","B) B","C) C","D) D"],
answer:"B) B",
exp:"Blue and yellow stripes are shared by Fish 2, 3, 4, and 5 — this group forms a clade (monophyletic). The synapomorphy that unites them must be placed at their common ancestor node. Position B on the tree is the node uniting Fish 2, 3, 4, 5 — so B&Y stripes belong at position B.",
con:"Phylogenetics — Placing Synapomorphies on Trees"},

{src:'m2b',q:9,
question:"If fish 2, 3, 4 and 5 were placed into a single group, it would be",
visual:"IMG:fishtable",
options:["A) Polyphyletic","B) Paraphyletic","C) Monophyletic"],
answer:"C) Monophyletic",
exp:"Fish 2, 3, 4, 5 all share a single common ancestor, and that ancestor AND all its descendants are included in the group. This is the definition of a monophyletic (natural/clade) grouping. Paraphyletic = ancestor included but some descendants excluded. Polyphyletic = multiple ancestors.",
con:"Phylogenetics — Mono/Para/Polyphyletic Groups"},

{src:'m2b',q:10,
question:"The blue fish color might be an example of",
visual:"IMG:fishtable",
options:["A) Convergent evolution","B) A synapomorphy","C) A vestigial trait"],
answer:"A) Convergent evolution",
exp:"Fish 1 and Fish 4 are in DIFFERENT clades of the tree (not sister taxa) yet both are blue. Blue evolved independently in two separate lineages = convergent evolution (homoplasy). A synapomorphy would unite them in a clade — but they're not each other's closest relatives.",
con:"Phylogenetics — Homoplasy (Convergent Evolution)"},

{src:'m2b',q:11,
question:"Reproduction in land plants is best described as alternation of a",
options:["A) Multicellular gametophyte with a single-celled sporophyte","B) Haploid gametophyte with a diploid sporophyte","C) Diploid gametophyte with a haploid sporophyte","D) Single-celled gametophyte with a multicellular sporophyte"],
answer:"B) Haploid gametophyte with a diploid sporophyte",
exp:"Alternation of generations: Haploid (n) gametophyte stage alternates with Diploid (2n) sporophyte stage. Gametophyte produces gametes by mitosis. Sporophyte produces spores by meiosis. Both stages are multicellular in land plants. The relative size/dominance varies by plant group.",
con:"Plant Life Cycles — Alternation of Generations"},

{src:'m2b',q:12,
question:"A botanist discovers a new species of plant in a tropical rain forest. After observing its anatomy and life cycle, she notes the following characteristics: a vascular system and seeds encased in fruit. This plant is probably most closely related to ________.",
options:["A) Ferns","B) Gymnosperms","C) Flowering plants","D) Mosses"],
answer:"C) Flowering plants (angiosperms)",
exp:"Seeds encased in FRUIT = angiosperms (flowering plants). Fruit = mature ovary wall surrounding seed. Gymnosperms have NAKED seeds (no fruit). Ferns = seedless vascular plants. Mosses = non-vascular + no seeds. Vascular + seeds in fruit = uniquely angiosperm.",
con:"Plant Diversity — Angiosperm Identification (Fruit)"},

{src:'m2b',q:13,
question:"In 2013, researchers at the University of British Columbia isolated the single-celled symbiont from the guts of termites and they named it Cthulhu because of its resemblance to a monster of the same name from science fiction. They concluded that it was a protist, not a bacteria, because it had",
options:["A) A membrane-bound nucleus","B) The ability to digest organic matter","C) A flagellum","D) Ribosomes"],
answer:"A) A membrane-bound nucleus",
exp:"Protists = eukaryotes = have membrane-bound nuclei and organelles. Bacteria are prokaryotes = no membrane-bound nucleus. Flagella exist in BOTH bacteria and eukaryotes (different structures). Ribosomes = in all cells. Digesting organic matter = many organisms can do this. The nucleus is the definitive eukaryote feature.",
con:"Microbiology — Protist vs Bacteria: Membrane-Bound Nucleus"},

{src:'m2b',q:14,
question:"A microbiologist travels to the deep sea in a submarine and samples the symbiotic bacteria living inside of tube worms. Upon taking these bacteria to a lab, they discover that this bacteria absorbs large organic molecules as a source of carbon and uses sugar as an electron donor to produce ATP. The microbiologist classified this bacteria as a:",
options:["A) Chemoorgano heterotroph","B) Chemolitho autotroph","C) Photo heterotroph","D) Chemolitho heterotroph"],
answer:"A) Chemoorgano heterotroph",
exp:"Carbon source = large organic molecules → HETEROTROPH (uses organic carbon, doesn't fix CO₂). Electron donor = sugar (organic molecule) → ORGANO. Energy source = chemical (not light) → CHEMO. Therefore: Chemoorgano heterotroph. Note: sugar as electron donor, NOT inorganic molecule.",
con:"Microbial Metabolism — Chemoorgano Heterotroph Classification"},

{src:'m2b',q:15,
question:"As a biologist studying dinoflagellates (a type of protist) from local oceans, you notice that the chloroplast is surrounded by four membranes. You also notice that the chloroplast shares many characteristics with red algae, and you find circular DNA closely related to cyanobacteria DNA. From this, you hypothesize that this lineage of dinoflagellates was the result of",
options:["A) DNA transfer by transduction","B) Primary endosymbiosis","C) Recombination via conjugation","D) Secondary endosymbiosis"],
answer:"D) Secondary endosymbiosis",
exp:"PRIMARY endosymbiosis = eukaryote engulfs cyanobacterium → 2 membranes (chloroplast inner + outer). SECONDARY endosymbiosis = eukaryote engulfs ANOTHER eukaryote that already had a chloroplast → 4 membranes. Four membranes + red algae similarity = this eukaryote engulfed a red alga = secondary endosymbiosis.",
con:"Endosymbiont Theory — Primary vs Secondary Endosymbiosis"},

{src:'m2b',q:16,
question:"Imagine that you are given some chemolithotrophic bacteria to grow. What should you use as a source of energy for this type of bacteria?",
options:["A) Light","B) Hydrogen sulfide","C) Carbon dioxide","D) Sugar"],
answer:"B) Hydrogen sulfide",
exp:"Chemolithotrophic = 'chemo' (chemical energy, not light) + 'litho' (inorganic molecules as electron donors). Hydrogen sulfide (H₂S) is a classic INORGANIC electron donor for chemolithotrophs (e.g., sulfur bacteria at hydrothermal vents). Light = photo. Sugar = organic. CO₂ = carbon source, not energy source.",
con:"Microbial Metabolism — Chemolithotrophs: Inorganic Electron Donors"},

{src:'m2b',q:17,
question:"In order for land plants to be successful, they needed a way to prevent water loss. An adaptation that developed to make this possible is known as the",
options:["A) Vascular tissues","B) Stomata","C) Cuticles","D) Chloroplast"],
answer:"C) Cuticles",
exp:"Cuticle = waxy layer coating the surface of leaves/stems = primary barrier against water loss (desiccation). Stomata regulate gas exchange but can also lose water when open (tradeoff). Vascular tissue = water/nutrient transport. Chloroplast = photosynthesis. Cuticle is the direct desiccation-preventing adaptation.",
con:"Plant Evolution — Cuticle as Terrestrial Adaptation"},

{src:'m2b',q:18,
question:"A researcher wanted to test the theory that Latrunculin A, an actin disrupter, would be an effective drug against the protist Girardia. She counted the number of cells that were moving in three conditions: control buffer (no drug), Latrunculin A and Latrunculin A followed by washing the cells with buffer. The data are below. What is a reasonable conclusion based on these results?",
visual:"IMG:latrunculin",
options:["A) Might be a good choice because it kills cells","B) This species doesn't depend on actin for movement","C) It might not work because the effect is reversible"],
answer:"A) It might be a good choice because it kills cells",
exp:"The key: motility stays LOW even after washing (not fully reversible → cells likely dead). If the drug were reversible, motility would return to near-control levels after washing. The persistent low motility post-wash suggests cell death, not just temporary actin disruption. This is promising for drug development.",
con:"Scientific Method — Drug Efficacy: Reversibility vs Cell Death"},

{src:'m2b',q:19,
question:"A newly discovered organism is found to use iron (Fe) for aerobic respiration and methane (CH3) from the air as a source of carbon. This organism must be a ________.",
options:["A) Chemoorgano autotroph","B) Photo heterotroph","C) Chemolitho heterotroph","D) Chemolitho autotroph"],
answer:"D) Chemolitho autotroph",
exp:"Iron (Fe) as electron donor = LITHO (inorganic). Aerobic = oxygen is electron acceptor. Methane (CH₃) from air as CARBON SOURCE → AUTOTROPH (fixes carbon from methane, building own organics). Chemical energy = CHEMO. Note: CH₃ is the carbon source here, not an organic food — the organism builds sugars FROM it.",
con:"Microbial Metabolism — Chemolitho Autotroph Classification"},

{src:'m2b',q:20,
question:"While walking through Aldrich Park, you find a population of plants that you are not familiar with. Since you'll be on campus for several months, you decide to observe the population over the course of their reproductive life cycle. You observe that it is sporophyte dominant, releases spores and does not have flowers. Which lineage of plants would you hypothesize the plants to be a part of?",
options:["A) Gymnosperms","B) Ferns","C) Angiosperms","D) Mosses"],
answer:"B) Ferns",
exp:"Sporophyte dominant + spores + no flowers = FERNS (seedless vascular plants). Gymnosperms = sporophyte dominant + pollen/seeds + no flowers. Angiosperms = flowers. Mosses = gametophyte dominant. The combination 'sporophyte dominant + spores + no seeds + no flowers' = ferns.",
con:"Plant Diversity — Identifying Ferns"},

{src:'m2b',q:21,
question:"A new fertilizer factory is expected to lead to higher levels nitrogen-based fertilizer in rivers. Which of the following is a likely consequence?",
options:["A) Algal blooms die off and decompose, leading to hypoxia and dead zones","B) The added pollution will have little effect","C) Fertilizer-enriched water leads to algal blooms that enrich water with oxygen","D) Fish populations will grow from greater resources"],
answer:"A) Fertilizer-induced algal blooms eventually die off and decompose, leading to hypoxia (lack of oxygen) and dead zones",
exp:"Nitrogen → algal bloom (eutrophication) → algae die → bacteria decompose dead algae using O₂ → oxygen depletion → hypoxia/dead zones. Although algae initially produce O₂, the decomposition phase consumes far more O₂ than was produced. This is the classic eutrophication cycle.",
con:"Ecology — Eutrophication: Nitrogen Runoff & Dead Zones"},

{src:'m2b',q:22,
question:"All protists are ________.",
options:["A) Unicellular","B) Eukaryotic","C) Symbionts","D) Monophyletic"],
answer:"B) Eukaryotic",
exp:"Protists = diverse group of EUKARYOTES that are not plants, animals, or fungi. They can be unicellular OR multicellular (e.g., kelp = giant multicellular protist). Not all are symbionts. Protista is NOT monophyletic — it's a polyphyletic/paraphyletic grouping of diverse eukaryote lineages.",
con:"Microbiology — Protists: Defining Characteristic (Eukaryotic)"},

{src:'m2b',q:23,
question:"A researcher found a new plant species and wanted to know if it reproduced through alternation of generations. Which of the following would be consistent with alternation of generations?",
options:["A) Gametes are diploid","B) Zygotes undergo mitosis to develop into multicellular haploid gametophytes","C) Gametophytes are haploid","D) Meiosis gives rise to the gametes"],
answer:"C) Gametophytes are haploid",
exp:"Alternation of generations: Sporophyte (2n) → meiosis → spores (n) → mitosis → gametophyte (n) → mitosis → gametes (n) → fertilization → zygote (2n) → sporophyte. Gametophytes ARE haploid (n) ✓. Gametes are haploid (not diploid). Zygotes undergo mitosis to form sporophytes (not gametophytes). Meiosis → spores (not gametes).",
con:"Plant Life Cycles — Alternation of Generations Details"},

{src:'m2b',q:24,
question:"What stage of the plant life cycle occurs when plants are haploid (n)?",
options:["A) Mitosis","B) Gametophyte","C) Sporophyte","D) Seed"],
answer:"B) Gametophyte",
exp:"Gametophyte = haploid (n) stage. Sporophyte = diploid (2n) stage. The gametophyte produces gametes (by mitosis). The sporophyte produces spores (by meiosis). Seeds contain a diploid embryo (sporophyte) inside a seed coat. 'Gameto' = gamete-producing = haploid.",
con:"Plant Life Cycles — Gametophyte (n) vs Sporophyte (2n)"},

{src:'m2b',q:25,
question:"Which of the following is important for global nitrogen cycles?",
options:["A) Bacteria that fix N₂","B) Plants","C) Fungi that decompose dead plants","D) All of the above"],
answer:"D) All of the above",
exp:"Nitrogen cycle requires multiple players: (1) N₂-fixing bacteria (Rhizobium, Azotobacter) convert atmospheric N₂ → NH₄⁺/NH₃. (2) Plants absorb fixed nitrogen, building proteins and nucleic acids. (3) Decomposers (fungi, bacteria) break down dead plant matter → release nitrogen back to soil. All three are essential parts of the cycle.",
con:"Ecology — Nitrogen Cycle: Multiple Actors"},
