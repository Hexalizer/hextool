<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bio 94 – New Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surf:#1a1d27;--bord:#2e3347;
  --acc:#7c9ef5;--ora:#f5a05a;--grn:#6fd4a8;--pur:#b67cf5;
  --txt:#e8eaf2;--mut:#7b82a0;
  --cfr:#1e2235;--cbk:#1a2e28;
  --fin:#e8734a;--m3b:#6fc4d4;--m2b:#a8d46f;--m1b:#d4a06f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;overflow-x:hidden}
/* HEADER */
header{background:var(--surf);border-bottom:1px solid var(--bord);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.logo{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--acc);white-space:nowrap}
.logo span{color:var(--txt)}
.filters{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.fb{padding:5px 12px;border-radius:20px;border:1px solid var(--bord);background:transparent;color:var(--mut);font-family:'DM Sans',sans-serif;font-size:.75rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.fb:hover{border-color:var(--acc);color:var(--acc)}
.fb.active{font-weight:500}
.fb.fin.active{border-color:var(--fin);color:var(--fin);background:rgba(232,115,74,.12)}
.fb.m3b.active{border-color:var(--m3b);color:var(--m3b);background:rgba(111,196,212,.12)}
.fb.m2b.active{border-color:var(--m2b);color:var(--m2b);background:rgba(168,212,111,.12)}
.fb.m1b.active{border-color:var(--m1b);color:var(--m1b);background:rgba(212,160,111,.12)}
.fb.rev.active{border-color:var(--ora);color:var(--ora);background:rgba(245,160,90,.12)}
.stats{font-size:.72rem;color:var(--mut);white-space:nowrap}
/* PROGRESS */
.prog-wrap{height:3px;background:var(--bord)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--grn));transition:width .4s}
/* MAIN */
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 12px;gap:16px}
.counter{font-size:.8rem;color:var(--mut)}
.counter strong{color:var(--txt)}
/* BADGE */
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.68rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.b-fin{background:rgba(232,115,74,.15);color:var(--fin)}
.b-m3b{background:rgba(111,196,212,.15);color:var(--m3b)}
.b-m2b{background:rgba(168,212,111,.15);color:var(--m2b)}
.b-m1b{background:rgba(212,160,111,.15);color:var(--m1b)}
/* CARD */
.scene{width:100%;max-width:680px;perspective:1200px;cursor:pointer;touch-action:manipulation}
.card{width:100%;min-height:340px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;top:0;left:0;width:100%;min-height:340px;backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column}
.front{background:var(--cfr);border:1px solid var(--bord)}
.back{background:var(--cbk);border:1px solid rgba(111,212,168,.25);transform:rotateY(180deg)}
.hint{font-size:.68rem;color:var(--mut);text-align:center;margin-bottom:8px}
.qtext{font-family:'Playfair Display',serif;font-size:.95rem;line-height:1.65;margin-bottom:12px}
.vis{margin:6px 0 10px;border-radius:8px;background:rgba(0,0,0,.25);padding:8px;overflow-x:auto}
.vis svg{display:block;width:100%;min-width:200px}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:auto}
.opt{padding:8px 11px;border-radius:7px;border:1px solid var(--bord);font-size:.82rem;color:var(--mut);line-height:1.4}
.albl{font-size:.7rem;color:var(--grn);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px;font-weight:500}
.atxt{font-family:'Playfair Display',serif;font-size:1rem;color:var(--grn);margin-bottom:10px;line-height:1.5}
.exp{font-size:.82rem;color:var(--mut);line-height:1.65;background:rgba(0,0,0,.2);padding:11px;border-radius:7px;border-left:3px solid var(--grn)}
.con{font-size:.74rem;color:var(--acc);margin-top:10px;padding:7px 10px;background:rgba(124,158,245,.08);border-radius:5px;border:1px solid rgba(124,158,245,.2)}
.con strong{display:block;margin-bottom:2px}
.back .qtext{font-size:.82rem;color:var(--mut);margin-bottom:9px}
/* NAV */
.nav{display:flex;gap:10px;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
.nbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--bord);background:var(--surf);color:var(--txt);font-size:.95rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.nbtn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
.shuf{padding:8px 16px;border-radius:22px;border:1px solid var(--bord);background:var(--surf);color:var(--mut);font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;transition:all .2s}
.shuf:hover{border-color:var(--ora);color:var(--ora)}
.srow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.spill{padding:5px 12px;border-radius:16px;font-size:.78rem;font-weight:500}
.spill.k{background:rgba(111,212,168,.15);color:var(--grn);border:1px solid rgba(111,212,168,.3)}
.spill.r{background:rgba(245,160,90,.12);color:var(--ora);border:1px solid rgba(245,160,90,.3)}
.mbtn{padding:7px 16px;border-radius:16px;border:none;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s}
.mk{background:rgba(111,212,168,.2);color:var(--grn)}
.mk:hover{background:rgba(111,212,168,.35)}
.mr{background:rgba(245,160,90,.15);color:var(--ora)}
.mr:hover{background:rgba(245,160,90,.3)}
@media(max-width:480px){
  header{padding:10px 12px;gap:8px}
  .filters{gap:4px}
  .fb{padding:4px 9px;font-size:.7rem}
  .face{padding:14px}
  .qtext{font-size:.88rem}
  main{padding:10px 8px;gap:12px}
}
</style>
</head>
<body>
<header>
  <div class="logo">Bio<span>94</span> New</div>
  <div class="filters">
    <button class="fb fin active" onclick="setF('all')">All (100)</button>
    <button class="fb fin" onclick="setF('final')">Final</button>
    <button class="fb m3b" onclick="setF('m3b')">M3 §B</button>
    <button class="fb m2b" onclick="setF('m2b')">M2 §B</button>
    <button class="fb m1b" onclick="setF('m1b')">M1 §B</button>
    <button class="fb rev" onclick="setF('review')">⚠ Review</button>
  </div>
  <div class="stats" id="st"></div>
</header>
<div class="prog-wrap"><div class="prog-fill" id="pb" style="width:0%"></div></div>
<main>
  <div class="counter" id="ctr"></div>
  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front" id="fr"></div>
      <div class="face back" id="bk"></div>
    </div>
  </div>
  <div class="nav">
    <button class="nbtn" id="pb2" onclick="prev()">←</button>
    <button class="shuf" onclick="shuf()">⇌ Shuffle</button>
    <button class="nbtn" id="nb" onclick="next()">→</button>
  </div>
  <div class="srow">
    <span class="spill k" id="kp">✓ 0</span>
    <button class="mbtn mk" onclick="mark('k')">✓ Got it</button>
    <button class="mbtn mr" onclick="mark('r')">⚠ Review</button>
    <span class="spill r" id="rp">⚠ 0</span>
  </div>
</main>

// FINAL Q14: Iguana behavior bar charts (spike raises = intrasexual; push-ups = intersexual)

options:["A) Protect embryo and maintain a fluid environment","B) Provide nutrients to the developing embryo","C) Collect metabolic waste products","D) Facilitate gas exchange between embryo and environment"],
answer:"A) Protect the embryo and maintain a fluid environment",
exp:"Amnion = fluid-filled membrane surrounding embryo = cushioning/protection + aquatic-like environment on land. Yolk sac = nutrients. Allantois = metabolic waste collection + gas exchange. Chorion = gas exchange with outer environment. Each of the 4 extraembryonic membranes has a distinct function.",
con:"Vertebrate Development — Extraembryonic Membranes"},

{src:'m3b',q:10,
question:"Sponges are most accurately described as:",
options:["A) Detritovores","B) Aquatic primary producers","C) Mass feeders","D) Suspension feeders"],
answer:"D) Suspension feeders",
exp:"Sponges = suspension/filter feeders. They pump large volumes of water through their pores (ostia), filtering out bacteria and particles. They are NOT photosynthetic (no primary production), not detritovores (don't consume dead matter from substrate), not mass feeders.",
con:"Animal Diversity — Porifera (Sponges) — Suspension Feeding"},

{src:'m3b',q:11,
question:"You can distinguish PRIMARY research articles from other articles because they contain:",
options:["A) An extensive reference section","B) A detailed abstract","C) Materials and methods and results sections","D) A conclusion with future directions"],
answer:"C) Materials and methods and results sections",
exp:"Primary research articles report ORIGINAL research. They contain: Introduction, Materials and Methods, Results, Discussion. The M&M section is the most definitive indicator — it describes what the researchers actually DID. Reviews and meta-analyses also have references and abstracts but lack M&M describing a novel experiment.",
con:"Scientific Method — Primary Research Articles"},

{src:'m3b',q:12,
question:"Which type of symmetry is characterized by having only ONE plane that creates mirror images?",
options:["A) Asymmetry","B) Radial symmetry","C) Bilateral symmetry","D) Biradial symmetry"],
answer:"C) Bilateral symmetry",
exp:"Bilateral symmetry = ONE plane of symmetry (left-right) creates two mirror-image halves. Radial symmetry = multiple planes through central axis create mirror images (sea stars, jellyfish). Asymmetry = no plane creates mirror images (sponges). Most animals are bilaterally symmetrical.",
con:"Animal Body Plans — Types of Symmetry"},

{src:'m3b',q:13,
question:"Pavan found a worm with SEGMENTS and a COELOM. He concluded it was a(n):",
options:["A) Platyhelminth","B) Annelid","C) Nematode"],
answer:"B) Annelid",
exp:"Segments + TRUE coelom = Annelid (or Arthropod, but this is a worm). Platyhelminthes = ACOELOMATE + unsegmented. Nematodes = pseudocoelomate (false coelom) + unsegmented. Annelids (earthworms, leeches) = segmented + true coelom.",
con:"Animal Body Plans — Annelid Identification"},

{src:'m3b',q:14,
question:"Pavan found an annelid. Bahareh looks for DNA sequences associated with SEGMENTS. She should look for DNA for:",
options:["A) Hox genes","B) Regulating shedding","C) Protostome development","D) Creating mesoderm"],
answer:"A) Hox genes",
exp:"Hox genes control body segmentation and patterning along the anterior-posterior axis. Segmentation in annelids is controlled by Hox gene expression. Ecdysis-regulating genes = arthropods. Mesoderm = too broad (all triploblasts). Hox genes are directly associated with segment identity.",
con:"Evo-Devo — Hox Genes & Segmentation"},

{src:'m3b',q:15,
question:"What is the relationship between HYPHAE and MYCELIUM in fungal structure?",
options:["A) Mycelium are threads that form hyphae structures","B) Hyphae are threads that form mycelium structures","C) They are two different names for the same component","D) Hyphae are reproductive structures; mycelium are feeding structures"],
answer:"B) Hyphae are threads that form mycelium structures",
exp:"Hyphae = individual thread-like filaments (the basic unit). Mycelium = the network/mass formed by many branching hyphae interconnected. Think: hyphae → threads; mycelium → the whole network. Both hyphae and mycelium function in nutrient absorption.",
con:"Fungi — Hyphae vs Mycelium"},

{src:'m3b',q:16,
question:"From the animal phylogeny, which synapomorphy could be placed at Branch #2?",
visual:V.animal_m3b,
options:["A) Triploblasty","B) Coelom","C) Diploblasty","D) Multicellularity"],
answer:"D) Multicellularity",
exp:"Branch #2 unites all animals after Sponges diverge (at branch 1). All animals from branch 2 onward are multicellular with differentiated cells. Diploblasty/Triploblasty are more derived. Coelom is even more derived. Multicellularity is the basal animal synapomorphy.",
con:"Animal Phylogeny — Multicellularity at Branch 2"},

{src:'m3b',q:17,
question:"Being a TRIPLOBLAST is a synapomorphy at branch number:",
visual:V.animal_m3b,
options:["A) 5","B) 4","C) 3","D) 8"],
answer:"B) 4",
exp:"Branch #4 = Bilateria (all bilaterally symmetrical animals with 3 germ layers). Cnidaria (branch 7 area) are DIPLOBLASTIC (2 germ layers). Branch #4 is where triploblasty (ectoderm + mesoderm + endoderm) originated, above Cnidaria.",
con:"Animal Phylogeny — Triploblasty at Branch 4"},

{src:'m3b',q:18,
question:"Having JOINTED LEGS was a major animal innovation. This trait is a synapomorphy at branch number:",
visual:V.animal_m3b,
options:["A) 10","B) 16","C) 13","D) 6"],
answer:"B) 16",
exp:"Branch #16 = Arthropoda. Jointed legs (arthropods) are a synapomorphy of Arthropoda alone on this tree. Branch 16 leads specifically to arthropods (insects, crabs, spiders, etc.) — the only group among these with jointed legs as a defining trait.",
con:"Animal Phylogeny — Arthropoda Synapomorphy (Branch 16)"},

{src:'m3b',q:19,
question:"If plants were kept in the DARK to prevent photosynthesis, the carbon concentration in their fungal symbionts would:",
options:["A) Remain unchanged","B) Increase","C) Significantly decrease"],
answer:"C) Significantly decrease",
exp:"Mycorrhizal fungi receive carbon (sugars) from the plant via photosynthesis — the plant is the carbon source in this mutualism. Without light → no photosynthesis → no sugar production → fungi receive no carbon → carbon concentration in fungus decreases significantly.",
con:"Fungi Ecology — Mycorrhizal Mutualism: Carbon Flow"},

{src:'m3b',q:20,
question:"The cordyceps fungus drives infected ants to climb to locations with HIGH HUMIDITY and COOL TEMPERATURES because these conditions:",
options:["A) Are better for rapid asexual reproduction","B) Kill the ant more quickly","C) Prevent other ants from removing the infected individual","D) Maximize fungal spore survival and dispersal"],
answer:"D) Maximize fungal spore survival and dispersal",
exp:"The fungus manipulates ant behavior to optimize conditions for its OWN reproduction and spore dispersal. High humidity + cool temperatures = optimal conditions for the fungus's fruiting body to grow and release spores that will land on other ants below.",
con:"Fungi Ecology — Zombie Fungus Behavioral Manipulation"},

{src:'m3b',q:21,
question:"What does 'protostome' refer to in animal development?",
options:["A) The first opening during gastrulation becomes the mouth","B) The animal has a protein-based exoskeleton","C) The organism develops radial symmetry during embryonic stages","D) The second opening during gastrulation becomes the mouth"],
answer:"A) The first opening during gastrulation becomes the mouth",
exp:"Protostome = 'first mouth' = the blastopore (first opening) becomes the MOUTH. Examples: annelids, molluscs, arthropods, nematodes. Deuterostomes = 'second mouth' = blastopore → anus; a second opening forms the mouth. Examples: echinoderms, chordates.",
con:"Animal Development — Protostome vs Deuterostome"},

{src:'m3b',q:22,
question:"What are NEMATOCYTES in cnidarians?",
options:["A) Filter-feeding structures in jellyfish tentacles","B) Photosynthetic algae living symbiotically in coral","C) Specialized stinging cells with harpoon-like structures","D) Reproductive cells released during spawning"],
answer:"C) Specialized stinging cells with harpoon-like structures",
exp:"Nematocytes (also called cnidocytes) = stinging cells unique to Cnidaria. They contain nematocysts — coiled harpoon-like structures that fire when triggered, injecting venom. Used for prey capture and defense. The symbionts in coral = zooxanthellae, not nematocytes.",
con:"Animal Diversity — Cnidaria: Nematocytes"},

{src:'m3b',q:23,
question:"Which specialized cells in the epidermis produce MELANIN pigment?",
options:["A) Melanocytes","B) Keratinocytes","C) Fibroblasts","D) Epithelial cells"],
answer:"A) Melanocytes",
exp:"Melanocytes = specialized cells in the epidermis (stratum basale) that synthesize melanin. They transfer melanin granules to surrounding keratinocytes via dendrites. Keratinocytes = primary structural cells of epidermis. Fibroblasts = connective tissue cells. Melanin protects DNA from UV-B radiation.",
con:"Human Biology — Skin Cells: Melanocytes vs Keratinocytes"},

{src:'m3b',q:24,
question:"Why is melanoma considered a relatively WEAK selective pressure in human evolution?",
options:["A) Most melanoma deaths occur after peak reproductive years","B) UV radiation does not cause mutations in DNA","C) Melanoma death rates are equal across all populations","D) Darker skin completely prevents melanoma"],
answer:"A) Most melanoma deaths occur after peak reproductive years",
exp:"Natural selection acts most strongly on traits affecting reproductive success. Since melanoma typically develops and kills AFTER people have already had children (post-reproductive), it has weak selective pressure — people pass on their alleles before the disease is lethal. Contrast with folate degradation (affects fetal development = strong selection).",
con:"Human Evolution — Selection Pressure & Reproductive Age"},

{src:'m3b',q:25,
question:"What is the NOTOCHORD?",
options:["A) A series of protective bones surrounding the spinal cord","B) The muscular tail that extends beyond the anus in all chordate groups","C) A stiff rod that provides structural support","D) The hollow nerve cord that runs along the dorsal side of chordates"],
answer:"C) A stiff rod that provides structural support",
exp:"Notochord = flexible but firm rod-like structure that provides structural support in chordate embryos (and adult in some species like amphioxus). NOT the vertebral column (which replaces it in vertebrates) and NOT the nerve cord (which is hollow and dorsal — a separate chordate feature).",
con:"Chordates — The Notochord (vs Vertebral Column vs Nerve Cord)"},

{src:'m2b',q:1,
question:"What is the correct order of evolutionary events in the Pre-Cambrian?",
options:["A) Photosynthesis → Eukaryotes → Multicellular animals","B) Eukaryotes → Multicellular animals → Photosynthesis","C) Eukaryotes → Photosynthesis → Multicellular animals"],
answer:"A) Photosynthesis, Eukaryotes, Multicellular animals",
exp:"Timeline: Photosynthesis (cyanobacteria, ~3.5 Bya) → Eukaryotes (~2 Bya, via endosymbiosis) → Multicellular animals (~700 Mya). Photosynthesis oxygenated the atmosphere, enabling aerobic metabolism needed for larger, complex eukaryotes and eventually animals.",
con:"Macroevolution — Pre-Cambrian Timeline"},

{src:'m2b',q:2,
question:"After dinosaur mass extinction, ecological niches were filled by rapidly diverging new mammals. Which term best describes this?",
options:["A) Adaptive radiation","B) Convergent evolution","C) Homoplasies","D) Synapomorphies"],
answer:"A) Adaptive radiation",
exp:"Adaptive radiation = rapid diversification of one lineage into many species occupying different ecological niches. Post-dinosaur mammals rapidly diverged into herbivores, carnivores, insectivores, etc. — filling vacant niches = classic adaptive radiation.",
con:"Macroevolution — Adaptive Radiation"},

{src:'m2b',q:3,
question:"A new archaea species shares a common ancestor with eukaryotes. Evidence for this is that they both have:",
options:["A) Organelles and a nuclear membrane","B) Similar RNA polymerase and start codon","C) Peptidoglycan and cell walls","D) Chemoorgano heterotroph metabolism"],
answer:"B) Similar RNA polymerase and start codon",
exp:"Universal molecular features shared by all life = evidence of common ancestry: same genetic code (AUG start codon), similar RNA polymerases. Archaea and eukaryotes share MANY similarities vs bacteria (RNA pol, histone-like proteins). Organelles/nuclear membrane = unique to eukaryotes. Peptidoglycan = bacteria only.",
con:"Universal Common Ancestry — Archaea-Eukaryote Molecular Evidence"},

{src:'m2b',q:4,
question:"Based on the phylogram, approximately how many years ago did the ANCESTOR OF A diverge from B?",
visual:V.phylogram_mya,
options:["A) 0.5 million years","B) 1 million years","C) 2 million years","D) 3 million years"],
answer:"D) 3 million years",
exp:"Reading the x-axis (right=0, left=4 Mya): A's branch splits from B's lineage at the node where A diverges — at approximately x=3 on the time axis = 3 million years ago. The root of the whole tree is at ~4 Mya. A and B are sister taxa sharing a node at ~3 Mya.",
con:"Phylogenetics — Reading Phylograms with Time Axis"},

{src:'m2b',q:5,
question:"Tubes form between bacterial cells; small circular DNA pieces transported through the tube. You conclude the bacteria are engaging in:",
options:["A) Plasmid transfer via conjugation","B) DNA transfer by transformation","C) DNA transfer by transduction","D) Recombination via conjugation"],
answer:"A) Plasmid transfer via conjugation",
exp:"Conjugation = direct cell-to-cell DNA transfer via a pilus (tube/bridge). Small circular DNA pieces = PLASMIDS. Transformation = uptake of free DNA from environment. Transduction = phage-mediated transfer. The key here: physical tube between cells + circular DNA = plasmid transfer via conjugation.",
con:"Bacterial Gene Transfer — Conjugation (Plasmid Transfer)"},

{src:'m2b',q:6,
question:"To prove a seed is from an angiosperm, which feature best supports this?",
options:["A) It produces gametes by mitosis rather than meiosis","B) It has a triploid endosperm","C) It retains its fertilized egg within its anther","D) It undergoes alternation of generations"],
answer:"B) It has a triploid endosperm",
exp:"Triploid endosperm = product of DOUBLE FERTILIZATION (unique to angiosperms). One sperm fertilizes egg → zygote; second sperm fertilizes polar nuclei → triploid (3n) endosperm = nutrient tissue. Gymnosperms and all other plants don't have triploid endosperm. Alternation of generations = all land plants.",
con:"Plant Reproduction — Double Fertilization & Triploid Endosperm"},

{src:'m2b',q:7,
question:"Fish trait table (color, scales, eye color, length, stripes). Which trait was NOT useful for building the phylogenetic tree?",
visual:V.fish_phylo,
options:["A) Scales","B) Stripes","C) Fish color","D) Eye color","E) Length"],
answer:"D) Eye color",
exp:"All fish AND the outgroup have the SAME eye color (black) — no variation means no phylogenetic information. A trait must vary among species to be useful for building a tree. The other traits (scales, stripes, color, length) vary among species and can be used as characters.",
con:"Phylogenetics — Which Characters Are Informative"},

{src:'m2b',q:8,
question:"Based on the fish traits, which position on the tree is the accurate placement for the synapomorphy 'blue and yellow stripes'?",
visual:V.fish_phylo,
options:["A) A","B) B","C) C","D) D"],
answer:"B) B",
exp:"Blue and yellow stripes are shared by Fish 2, 3, 4, and 5 — this group forms a clade (monophyletic). The synapomorphy that unites them must be placed at their common ancestor node. Position B on the tree is the node uniting Fish 2, 3, 4, 5 — so B&Y stripes belong at position B.",
con:"Phylogenetics — Placing Synapomorphies on Trees"},

{src:'m2b',q:9,
question:"If Fish 2, 3, 4, and 5 were placed into a single group, it would be:",
visual:V.fish_phylo,
options:["A) Polyphyletic","B) Paraphyletic","C) Monophyletic"],
answer:"C) Monophyletic",
exp:"Fish 2, 3, 4, 5 all share a single common ancestor, and that ancestor AND all its descendants are included in the group. This is the definition of a monophyletic (natural/clade) grouping. Paraphyletic = ancestor included but some descendants excluded. Polyphyletic = multiple ancestors.",
con:"Phylogenetics — Mono/Para/Polyphyletic Groups"},

{src:'m2b',q:10,
question:"Blue fish color (in Fish 1 AND Fish 4, which are in separate clades) might be an example of:",
visual:V.fish_phylo,
options:["A) Convergent evolution","B) A synapomorphy","C) A vestigial trait"],
answer:"A) Convergent evolution",
exp:"Fish 1 and Fish 4 are in DIFFERENT clades of the tree (not sister taxa) yet both are blue. Blue evolved independently in two separate lineages = convergent evolution (homoplasy). A synapomorphy would unite them in a clade — but they're not each other's closest relatives.",
con:"Phylogenetics — Homoplasy (Convergent Evolution)"},

{src:'m2b',q:11,
question:"Reproduction in land plants is best described as alternation of a:",
options:["A) Multicellular gametophyte with a single-celled sporophyte","B) Haploid gametophyte with a diploid sporophyte","C) Diploid gametophyte with a haploid sporophyte","D) Single-celled gametophyte with a multicellular sporophyte"],
answer:"B) Haploid gametophyte with a diploid sporophyte",
exp:"Alternation of generations: Haploid (n) gametophyte stage alternates with Diploid (2n) sporophyte stage. Gametophyte produces gametes by mitosis. Sporophyte produces spores by meiosis. Both stages are multicellular in land plants. The relative size/dominance varies by plant group.",
con:"Plant Life Cycles — Alternation of Generations"},

{src:'m2b',q:12,
question:"A botanist finds a plant with a vascular system and seeds encased in fruit. Most closely related to:",
options:["A) Ferns","B) Gymnosperms","C) Flowering plants","D) Mosses"],
answer:"C) Flowering plants (angiosperms)",
exp:"Seeds encased in FRUIT = angiosperms (flowering plants). Fruit = mature ovary wall surrounding seed. Gymnosperms have NAKED seeds (no fruit). Ferns = seedless vascular plants. Mosses = non-vascular + no seeds. Vascular + seeds in fruit = uniquely angiosperm.",
con:"Plant Diversity — Angiosperm Identification (Fruit)"},

{src:'m2b',q:13,
question:"Researchers concluded Cthulhu (single-celled termite gut symbiont) was a PROTIST, not bacteria, because it had:",
options:["A) A membrane-bound nucleus","B) The ability to digest organic matter","C) A flagellum","D) Ribosomes"],
answer:"A) A membrane-bound nucleus",
exp:"Protists = eukaryotes = have membrane-bound nuclei and organelles. Bacteria are prokaryotes = no membrane-bound nucleus. Flagella exist in BOTH bacteria and eukaryotes (different structures). Ribosomes = in all cells. Digesting organic matter = many organisms can do this. The nucleus is the definitive eukaryote feature.",
con:"Microbiology — Protist vs Bacteria: Membrane-Bound Nucleus"},

{src:'m2b',q:14,
question:"Deep-sea bacteria absorb large organic molecules as carbon source and use SUGAR as electron donor. Classified as:",
options:["A) Chemoorgano heterotroph","B) Chemolitho autotroph","C) Photo heterotroph","D) Chemolitho heterotroph"],
answer:"A) Chemoorgano heterotroph",
exp:"Carbon source = large organic molecules → HETEROTROPH (uses organic carbon, doesn't fix CO₂). Electron donor = sugar (organic molecule) → ORGANO. Energy source = chemical (not light) → CHEMO. Therefore: Chemoorgano heterotroph. Note: sugar as electron donor, NOT inorganic molecule.",
con:"Microbial Metabolism — Chemoorgano Heterotroph Classification"},

{src:'m2b',q:15,
question:"A dinoflagellate's chloroplast has FOUR membranes, shares traits with red algae, and has circular DNA related to cyanobacteria. This suggests:",
options:["A) DNA transfer by transduction","B) Primary endosymbiosis","C) Recombination via conjugation","D) Secondary endosymbiosis"],
answer:"D) Secondary endosymbiosis",
exp:"PRIMARY endosymbiosis = eukaryote engulfs cyanobacterium → 2 membranes (chloroplast inner + outer). SECONDARY endosymbiosis = eukaryote engulfs ANOTHER eukaryote that already had a chloroplast → 4 membranes. Four membranes + red algae similarity = this eukaryote engulfed a red alga = secondary endosymbiosis.",
con:"Endosymbiont Theory — Primary vs Secondary Endosymbiosis"},

{src:'m2b',q:16,
question:"You are given chemolithotrophic bacteria to grow. What should you use as their energy source?",
options:["A) Light","B) Hydrogen sulfide","C) Carbon dioxide","D) Sugar"],
answer:"B) Hydrogen sulfide",
exp:"Chemolithotrophic = 'chemo' (chemical energy, not light) + 'litho' (inorganic molecules as electron donors). Hydrogen sulfide (H₂S) is a classic INORGANIC electron donor for chemolithotrophs (e.g., sulfur bacteria at hydrothermal vents). Light = photo. Sugar = organic. CO₂ = carbon source, not energy source.",
con:"Microbial Metabolism — Chemolithotrophs: Inorganic Electron Donors"},

{src:'m2b',q:17,
question:"Land plants needed to prevent water loss. An adaptation that made this possible is:",
options:["A) Vascular tissues","B) Stomata","C) Cuticles","D) Chloroplast"],
answer:"C) Cuticles",
exp:"Cuticle = waxy layer coating the surface of leaves/stems = primary barrier against water loss (desiccation). Stomata regulate gas exchange but can also lose water when open (tradeoff). Vascular tissue = water/nutrient transport. Chloroplast = photosynthesis. Cuticle is the direct desiccation-preventing adaptation.",
con:"Plant Evolution — Cuticle as Terrestrial Adaptation"},

{src:'m2b',q:18,
question:"Latrunculin A (actin disrupter) was tested against Girardia cells. Control=~90% motile; Latrunculin A=~10%; after wash=~15%. Reasonable conclusion?",
visual:V.latrunculin,
options:["A) Might be a good choice because it kills cells","B) This species doesn't depend on actin for movement","C) It might not work because the effect is reversible"],
answer:"A) It might be a good choice because it kills cells",
exp:"The key: motility stays LOW even after washing (not fully reversible → cells likely dead). If the drug were reversible, motility would return to near-control levels after washing. The persistent low motility post-wash suggests cell death, not just temporary actin disruption. This is promising for drug development.",
con:"Scientific Method — Drug Efficacy: Reversibility vs Cell Death"},

{src:'m2b',q:19,
question:"An organism uses iron (Fe) for aerobic respiration and methane (CH₃) from air as carbon source. It must be a:",
options:["A) Chemoorgano autotroph","B) Photo heterotroph","C) Chemolitho heterotroph","D) Chemolitho autotroph"],
answer:"D) Chemolitho autotroph",
exp:"Iron (Fe) as electron donor = LITHO (inorganic). Aerobic = oxygen is electron acceptor. Methane (CH₃) from air as CARBON SOURCE → AUTOTROPH (fixes carbon from methane, building own organics). Chemical energy = CHEMO. Note: CH₃ is the carbon source here, not an organic food — the organism builds sugars FROM it.",
con:"Microbial Metabolism — Chemolitho Autotroph Classification"},

{src:'m2b',q:20,
question:"Aldrich Park plants: sporophyte dominant, releases SPORES, does NOT have flowers. Which plant lineage?",
options:["A) Gymnosperms","B) Ferns","C) Angiosperms","D) Mosses"],
answer:"B) Ferns",
exp:"Sporophyte dominant + spores + no flowers = FERNS (seedless vascular plants). Gymnosperms = sporophyte dominant + pollen/seeds + no flowers. Angiosperms = flowers. Mosses = gametophyte dominant. The combination 'sporophyte dominant + spores + no seeds + no flowers' = ferns.",
con:"Plant Diversity — Identifying Ferns"},

{src:'m2b',q:21,
question:"A new fertilizer factory will increase nitrogen-based fertilizer in rivers. Likely consequence:",
options:["A) Algal blooms die off and decompose, leading to hypoxia and dead zones","B) The added pollution will have little effect","C) Fertilizer-enriched water leads to algal blooms that enrich water with oxygen","D) Fish populations will grow from greater resources"],
answer:"A) Fertilizer-induced algal blooms eventually die off and decompose, leading to hypoxia (lack of oxygen) and dead zones",
exp:"Nitrogen → algal bloom (eutrophication) → algae die → bacteria decompose dead algae using O₂ → oxygen depletion → hypoxia/dead zones. Although algae initially produce O₂, the decomposition phase consumes far more O₂ than was produced. This is the classic eutrophication cycle.",
con:"Ecology — Eutrophication: Nitrogen Runoff & Dead Zones"},

{src:'m2b',q:22,
question:"All protists are ________.",
options:["A) Unicellular","B) Eukaryotic","C) Symbionts","D) Monophyletic"],
answer:"B) Eukaryotic",
exp:"Protists = diverse group of EUKARYOTES that are not plants, animals, or fungi. They can be unicellular OR multicellular (e.g., kelp = giant multicellular protist). Not all are symbionts. Protista is NOT monophyletic — it's a polyphyletic/paraphyletic grouping of diverse eukaryote lineages.",
con:"Microbiology — Protists: Defining Characteristic (Eukaryotic)"},

{src:'m2b',q:23,
question:"Which of the following is consistent with ALTERNATION OF GENERATIONS?",
options:["A) Gametes are diploid","B) Zygotes undergo mitosis to develop into multicellular haploid gametophytes","C) Gametophytes are haploid","D) Meiosis gives rise to the gametes"],
answer:"C) Gametophytes are haploid",
exp:"Alternation of generations: Sporophyte (2n) → meiosis → spores (n) → mitosis → gametophyte (n) → mitosis → gametes (n) → fertilization → zygote (2n) → sporophyte. Gametophytes ARE haploid (n) ✓. Gametes are haploid (not diploid). Zygotes undergo mitosis to form sporophytes (not gametophytes). Meiosis → spores (not gametes).",
con:"Plant Life Cycles — Alternation of Generations Details"},

{src:'m2b',q:24,
question:"What stage of the plant life cycle occurs when plants are HAPLOID (n)?",
options:["A) Mitosis","B) Gametophyte","C) Sporophyte","D) Seed"],
answer:"B) Gametophyte",
exp:"Gametophyte = haploid (n) stage. Sporophyte = diploid (2n) stage. The gametophyte produces gametes (by mitosis). The sporophyte produces spores (by meiosis). Seeds contain a diploid embryo (sporophyte) inside a seed coat. 'Gameto' = gamete-producing = haploid.",
con:"Plant Life Cycles — Gametophyte (n) vs Sporophyte (2n)"},

{src:'m2b',q:25,
question:"Which of the following is important for GLOBAL NITROGEN CYCLES?",
options:["A) Bacteria that fix N₂","B) Plants","C) Fungi that decompose dead plants","D) All of the above"],
answer:"D) All of the above",
exp:"Nitrogen cycle requires multiple players: (1) N₂-fixing bacteria (Rhizobium, Azotobacter) convert atmospheric N₂ → NH₄⁺/NH₃. (2) Plants absorb fixed nitrogen, building proteins and nucleic acids. (3) Decomposers (fungi, bacteria) break down dead plant matter → release nitrogen back to soil. All three are essential parts of the cycle.",
con:"Ecology — Nitrogen Cycle: Multiple Actors"},

// ══════════ MIDTERM 1 §B ══════════
{src:'m1b',q:1,
question:"Based on current evolutionary data, what do you and Peter the Anteater (Santa Ana Zoo) have in common?",
options:["A) You both are eukaryotes","B) You are both prokaryotes","C) You and Peter have nothing in common","D) You both lack a membrane-bound nucleus"],
answer:"A) You both are eukaryotes",
exp:"Humans and anteaters are both mammals — both eukaryotes with membrane-bound nuclei, membrane-bound organelles, and multicellularity. Prokaryotes lack all of these features. Both share a common ancestor as members of the animal kingdom.",
con:"Phylogenetics — Shared Derived Characters (Eukaryotes)"},

{src:'m1b',q:2,
question:"A researcher observed peacocks with larger, more colorful tail feathers attract more mates. Before concluding this evolved through sexual selection, what must be verified FIRST?",
options:["A) That peacocks can fly despite heavy tail feathers","B) That the trait is variable and heritable in the population","C) That female peacocks also have colorful feathers","D) That tail feathers provide protection from predators"],
answer:"B) That the trait is variable and heritable in the population",
exp:"For natural (or sexual) selection to cause evolution, the trait must be: (1) VARIABLE in the population, (2) HERITABLE. Without heritability, selection can't change allele frequencies across generations. This is Darwin's most essential precondition — you must verify heritability before concluding selection caused the trait.",
con:"Darwin's Postulates — Heritability Required Before Concluding Selection"},

{src:'m1b',q:3,
question:"Researchers hypothesized anteater tongue length correlates with anthill depth. Which graph from the observation study supports this hypothesis?",
visual:V.anteater_b,
options:["A) Bell curve peak aligned with the tongue-length dotted line","B) Increasing curve toward larger hills","C) Decreasing curve — feeds most at small hills","D) Bimodal"],
answer:"A) Bell curve peak aligned with the tongue-length dotted line",

// ─── STATE ────────────────────────────────────────────
let deck=[...cards],idx=0,known=new Set(),rev=new Set(),mode='all',flipped=false;

function setF(m){
  mode=m;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
  const map={all:0,final:1,m3b:2,m2b:3,m1b:4,review:5};
  document.querySelectorAll('.fb')[map[m]]?.classList.add('active');
  build();
}
function build(){
  if(mode==='all') deck=[...cards];
  else if(mode==='review') deck=cards.filter(c=>rev.has(c.src+c.q));
  else deck=cards.filter(c=>c.src===mode);
  idx=0; flipped=false; render();
}
function shuf(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  idx=0; flipped=false; document.getElementById('card').classList.remove('flipped'); render();
}
function flip(){flipped=!flipped;document.getElementById('card').classList.toggle('flipped',flipped);}
function next(){if(idx<deck.length-1){idx++;flipped=false;document.getElementById('card').classList.remove('flipped');render();}}
function prev(){if(idx>0){idx--;flipped=false;document.getElementById('card').classList.remove('flipped');render();}}
function mark(t){
  const c=deck[idx],k=c.src+c.q;
  if(t==='k'){known.add(k);rev.delete(k);}else{rev.add(k);known.delete(k);}
  updateScore(); next();
}
function updateScore(){
  document.getElementById('kp').textContent=`✓ ${known.size}`;
  document.getElementById('rp').textContent=`⚠ ${rev.size}`;
}
function bc(s){return{final:'b-fin',m3b:'b-m3b',m2b:'b-m2b',m1b:'b-m1b'}[s]||'b-fin'}
function bl(s){return{final:'Final Exam',m3b:'Midterm 3 §B',m2b:'Midterm 2 §B',m1b:'Midterm 1 §B'}[s]||s}

function render(){
  if(!deck.length){
    document.getElementById('fr').innerHTML='<div class="qtext" style="text-align:center;margin-top:60px;color:var(--mut)">No cards match this filter.</div>';
    document.getElementById('bk').innerHTML='';
    document.getElementById('ctr').innerHTML='';
    return;
  }
  const c=deck[idx],tot=deck.length,k=c.src+c.q;
  document.getElementById('pb').style.width=Math.round(((idx+1)/tot)*100)+'%';
  document.getElementById('ctr').innerHTML=`<strong>${idx+1}</strong> / ${tot}`;
  document.getElementById('st').textContent=`${idx+1}/${tot} · ✓${known.size} ⚠${rev.size}`;
  const si=known.has(k)?'✓ ':rev.has(k)?'⚠ ':'';
  let fh=`<div><span class="badge ${bc(c.src)}">${bl(c.src)} — Q${c.q}</span></div>
    <div class="hint">Tap card to reveal answer</div>
    <div class="qtext">${si}${c.question}</div>`;
  if(c.visual) fh+=`<div class="vis">${c.visual}</div>`;
  if(c.options){fh+='<div class="opts">';c.options.forEach(o=>{fh+=`<div class="opt">${o}</div>`;});fh+='</div>';}
  document.getElementById('fr').innerHTML=fh;
  let bh=`<div><span class="badge ${bc(c.src)}">${bl(c.src)} — Q${c.q}</span></div>
    <div class="qtext">${c.question}</div>
    <div class="albl">✓ Correct Answer</div>
    <div class="atxt">${c.answer}</div>
    <div class="exp">${c.exp}</div>`;
  if(c.con) bh+=`<div class="con"><strong>📌 Concept</strong>${c.con}</div>`;
  document.getElementById('bk').innerHTML=bh;
  document.getElementById('pb2').disabled=idx===0;
  document.getElementById('nb').disabled=idx===deck.length-1;
}

// Touch swipe + tap for mobile (prevents double-fire with click)
let sx=0,sy=0,lastTouch=0;
document.getElementById('scene').addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
},{passive:true});
document.getElementById('scene').addEventListener('touchend',e=>{
  lastTouch=Date.now();
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40){dx>0?prev():next();return;}
  if(Math.abs(dy)<20&&Math.abs(dx)<20) flip();
},{passive:true});
// Desktop click — ignored for 500ms after a touch to prevent double-fire
document.getElementById('scene').addEventListener('click',()=>{
  if(Date.now()-lastTouch<500) return;
  flip();
});
// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') next();
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp') prev();
  else if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='g') mark('k');
  else if(e.key==='r') mark('r');
});
render();updateScore();
